<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>ASSESS AI - QUIZ</title>
  <meta name="theme-color" content="#7C3AED"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="ASSESS AI QUIZ"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── 색상 & 스타일 ─────────────────────────────────────────
const PU = "#7C3AED", DK = "#1E293B";
const B = (bg, col="white", ex={}) => ({
  padding:"10px 20px", background:bg, color:col, border:"none",
  borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:14, ...ex
});
const INP = {
  padding:"10px 12px", border:"1px solid #E2E8F0", borderRadius:8,
  fontSize:14, width:"100%", boxSizing:"border-box", outline:"none", fontFamily:"inherit"
};

// ── 설정 저장 ─────────────────────────────────────────────
const CFG = {
  get fb()  { return "여기에_Firebase_URL_입력" || localStorage.getItem("qai_fb")  || ""; },
  set fb(v) { localStorage.setItem("qai_fb",  v); },
  get key() { return "여기에_Gemini_API키_입력" || localStorage.getItem("qai_key") || ""; },
  set key(v){ localStorage.setItem("qai_key", v); },
  get ok()  { return !!(this.fb && this.key); },
};

const sc = id => id ? id.slice(-6).toUpperCase() : "";

// ── Firebase ──────────────────────────────────────────────
const DB = {
  async get(path) {
    try {
      const r = await fetch(`${CFG.fb}/${path}.json`);
      const d = await r.json();
      return d;
    } catch { return null; }
  },
  async put(path, data) {
    await fetch(`${CFG.fb}/${path}.json`, {
      method:"PUT", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(data)
    });
  },
  async getQuizzes() {
    const d = await this.get("quizzes");
    if (!d) return [];
    return Object.values(d).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  },
  async saveQuizzes(arr) {
    const obj = {};
    arr.forEach(q => { obj[q.id] = q; });
    await this.put("quizzes", obj);
  },
  async getResults(qid) {
    const d = await this.get(`qresults/${qid}`);
    if (!d) return [];
    return Object.values(d);
  },
  async saveResult(qid, result) {
    const key = result.studentId.replace(/[.#$/[\]\s]/g, "_");
    await fetch(`${CFG.fb}/qresults/${qid}/${key}.json`, {
      method:"PUT", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(result)
    });
  },
};

// ── Gemini API ────────────────────────────────────────────
async function gemini(prompt) {
  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${CFG.key}`,
    {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        contents: [{ role:"user", parts:[{ text:prompt }] }],
        generationConfig: { maxOutputTokens:2000, temperature:0, thinkingConfig:{thinkingBudget:0} }
      })
    }
  );
  const d = await res.json();
  if (d.error) throw new Error(d.error.message);
  return d.candidates[0].content.parts.filter(p=>p.text).map(p=>p.text).join("");
}

function parseJSON(raw) {
  const clean = raw.replace(/```json|```/g,"").trim();
  const m = clean.match(/[\[{][\s\S]*[\]}]/);
  return m ? JSON.parse(m[0]) : null;
}

// ── 공통 컴포넌트 ─────────────────────────────────────────
function Empty({icon, text}) {
  return (
    <div style={{textAlign:"center", padding:48, color:"#94A3B8"}}>
      <div style={{fontSize:36, marginBottom:10}}>{icon}</div>
      <div style={{fontSize:14}}>{text}</div>
    </div>
  );
}
function Center({children}) {
  return (
    <div style={{display:"flex", alignItems:"center", justifyContent:"center",
      minHeight:"100vh", background:"#F5F3FF"}}>
      {children}
    </div>
  );
}
function QRImg({url}) {
  const ref = useRef(null);
  useEffect(() => {
    if (!url || !ref.current) return;
    ref.current.innerHTML = "";
    if (window.QRCode) {
      new window.QRCode(ref.current, {text:url, width:240, height:240});
    }
  }, [url]);
  return <div ref={ref} style={{lineHeight:0}} />;
}

// ══════════════════════════════════════════════════════════
// ROOT
// ══════════════════════════════════════════════════════════
function App() {
  const [page, setPage] = useState("boot");
  const [qid,  setQid]  = useState(null);
  const [cfg,  setCfg]  = useState(CFG.ok);

  useEffect(() => {
    const go = async () => {
      const p = new URLSearchParams(window.location.search);
      const id   = p.get("id");
      const code = p.get("code");
      if (id) { setQid(id); setPage("student"); return; }
      if (code) {
        const qs = await DB.getQuizzes();
        const f  = qs.find(q => sc(q.id) === code.toUpperCase());
        if (f) { setQid(f.id); setPage("student"); return; }
      }
      setPage("teacher");
    };
    go();
  }, []);

  if (page === "boot")    return null;
  if (page === "student") return <StudentPage qid={qid} />;
  if (!cfg) return <SetupPage onDone={() => setCfg(true)} />;
  return <TeacherApp onSetup={() => setCfg(false)} />;
}

// ══════════════════════════════════════════════════════════
// 설정 페이지
// ══════════════════════════════════════════════════════════
function SetupPage({onDone}) {
  const [fb,  setFb]  = useState(CFG.fb);
  const [key, setKey] = useState(CFG.key);

  const save = () => {
    if (!fb.trim() || !key.trim()) return alert("두 항목 모두 입력해주세요.");
    CFG.fb  = fb.trim().replace(/\/$/, "");
    CFG.key = key.trim();
    onDone();
  };

  return (
    <Center>
      <div style={{background:"white", borderRadius:20, padding:40, width:480,
        boxShadow:"0 16px 48px rgba(0,0,0,0.12)"}}>
        <div style={{textAlign:"center", marginBottom:28}}>
          <div style={{fontSize:40, marginBottom:10}}>⚙️</div>
          <h1 style={{fontSize:22, fontWeight:900, color:PU}}>ASSESS AI - QUIZ</h1>
          <p style={{color:"#64748B", fontSize:13, marginTop:6}}>초기 설정을 완료하면 바로 사용할 수 있습니다</p>
        </div>

        <div style={{marginBottom:20}}>
          <label style={{fontSize:13, fontWeight:700, color:DK, display:"block", marginBottom:6}}>
            1. Firebase Realtime Database URL
          </label>
          <input style={INP} value={fb} onChange={e=>setFb(e.target.value)}
            placeholder="https://프로젝트명-default-rtdb.firebaseio.com" />
          <div style={{fontSize:12, color:"#64748B", marginTop:8, lineHeight:1.8,
            background:"#F8FAFC", borderRadius:8, padding:12}}>
            ASSESS AI와 동일한 Firebase 주소를 입력하세요.
          </div>
        </div>

        <div style={{marginBottom:28}}>
          <label style={{fontSize:13, fontWeight:700, color:DK, display:"block", marginBottom:6}}>
            2. Google Gemini API 키
          </label>
          <input style={INP} type="password" value={key} onChange={e=>setKey(e.target.value)}
            placeholder="AIza..." />
          <div style={{fontSize:12, color:"#64748B", marginTop:8, lineHeight:1.8,
            background:"#F8FAFC", borderRadius:8, padding:12}}>
            <a href="https://aistudio.google.com/apikey" target="_blank"
              style={{color:PU}}>aistudio.google.com/apikey</a> → Create API Key (무료)
          </div>
        </div>

        <button onClick={save}
          style={B(PU, undefined, {width:"100%", padding:"13px", fontSize:15, borderRadius:10})}>
          설정 완료 → 시작하기
        </button>
      </div>
    </Center>
  );
}

// ══════════════════════════════════════════════════════════
// 교사 앱
// ══════════════════════════════════════════════════════════
function TeacherApp() {
  const [tab,     setTab]     = useState("generate");
  const [quizzes, setQuizzes] = useState([]);
  const [ready,   setReady]   = useState(false);

  useEffect(() => { DB.getQuizzes().then(q => { setQuizzes(q); setReady(true); }); }, []);

  const saveAll = async next => { await DB.saveQuizzes(next); setQuizzes(next); };

  const TABS = [
    ["generate", "✨ 문제 생성"],
    ["list",     "📚 저장된 문제"],
    ["qr",       "📱 QR코드"],
    ["results",  "📊 결과 확인"],
  ];

  return (
    <div style={{minHeight:"100vh", background:"#F5F3FF"}}>
      <header style={{background:PU, color:"white", padding:"0 20px",
        display:"flex", alignItems:"center", justifyContent:"space-between", height:54}}>
        <div style={{display:"flex", alignItems:"center", gap:8}}>
          <span style={{fontSize:18, fontWeight:900}}>ASSESS AI - QUIZ</span>
      </header>

      <div style={{background:"white", borderBottom:"1px solid #E2E8F0",
        display:"flex", paddingLeft:12}}>
        {TABS.map(([id, label]) => (
          <button key={id} onClick={() => setTab(id)} style={{
            padding:"12px 16px", border:"none", background:"none", cursor:"pointer",
            fontWeight: tab===id ? 700 : 500, fontSize:13,
            color: tab===id ? PU : "#64748B",
            borderBottom: tab===id ? `2px solid ${PU}` : "2px solid transparent"
          }}>{label}</button>
        ))}
      </div>

      <main style={{maxWidth:960, margin:"0 auto", padding:"24px 20px"}}>
        {!ready ? <Empty icon="⏳" text="로딩 중..." /> : <>
          {tab === "generate" && <GenerateTab quizzes={quizzes} onSave={saveAll} onSwitch={() => setTab("list")} />}
          {tab === "list"     && <ListTab     quizzes={quizzes} onSave={saveAll} />}
          {tab === "qr"       && <QRTab       quizzes={quizzes} />}
          {tab === "results"  && <ResultsTab  quizzes={quizzes} />}
        </>}
      </main>
    </div>
  );
}

// ── 문제 생성 탭 ──────────────────────────────────────────
function GenerateTab({quizzes, onSave, onSwitch}) {
  const [title,   setTitle]   = useState("");
  const [subject, setSubject] = useState("");
  const [grade,   setGrade]   = useState("");
  const [cls,     setCls]     = useState("");
  const [memo,    setMemo]    = useState("");
  const [loading, setLoading] = useState(false);
  const [qs,      setQs]      = useState([]);
  const [saved,   setSaved]   = useState(false);

  const generate = async () => {
    if (!title.trim() || !subject.trim()) return alert("제목과 수업 주제를 입력해주세요.");
    setLoading(true); setQs([]); setSaved(false);
    try {
      const prompt = `중학교 과학 수업 형성평가 문제 5개를 출제하세요.
수업 주제: ${subject}
${memo ? "수업 내용: " + memo : ""}
조건: 객관식 3문제(보기 4개), 주관식 2문제, 중학생 수준.
아래 JSON 배열만 출력하고 다른 텍스트 없이:
[
  {"type":"객관식","question":"문제내용","options":["①보기1","②보기2","③보기3","④보기4"],"answer":"①보기1","explanation":"해설"},
  {"type":"객관식","question":"문제내용","options":["①보기1","②보기2","③보기3","④보기4"],"answer":"②보기2","explanation":"해설"},
  {"type":"객관식","question":"문제내용","options":["①보기1","②보기2","③보기3","④보기4"],"answer":"③보기3","explanation":"해설"},
  {"type":"주관식","question":"문제내용","options":[],"answer":"정답","explanation":"해설"},
  {"type":"주관식","question":"문제내용","options":[],"answer":"정답","explanation":"해설"}
]`;
      const raw = await gemini(prompt);
      const parsed = parseJSON(raw);
      if (parsed) setQs(parsed);
      else alert("문제 생성 실패. 다시 시도해주세요.");
    } catch(e) { alert("오류: " + e.message); }
    setLoading(false);
  };

  const upQ   = (i,f,v) => { const n=[...qs]; n[i]={...n[i],[f]:v}; setQs(n); };
  const upOpt = (i,j,v) => { const n=[...qs]; n[i].options[j]=v; setQs(n); };

  const save = async () => {
    if (!qs.length) return;
    const quiz = { id:Date.now().toString(), title, subject, grade, cls, questions:qs, createdAt:new Date().toISOString() };
    await onSave([quiz, ...quizzes]);
    setSaved(true);
    setTimeout(() => { setSaved(false); onSwitch(); }, 1200);
  };

  return (
    <div>
      <div style={{background:"white", borderRadius:14, padding:24,
        boxShadow:"0 1px 4px rgba(0,0,0,0.07)", marginBottom:20}}>
        <h2 style={{margin:"0 0 18px", fontSize:16, fontWeight:700, color:DK}}>✨ AI 문제 자동 생성</h2>
        <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:12}}>
          {[["퀴즈 제목 *","text",title,setTitle,"예: 3학년 빛의 굴절 형성평가"],
            ["수업 주제 *","text",subject,setSubject,"예: 볼록렌즈와 오목렌즈"],
            ["학년","text",grade,setGrade,"예: 3"],
            ["반","text",cls,setCls,"예: 2"]
          ].map(([lbl,,val,set,ph]) => (
            <div key={lbl}>
              <label style={{fontSize:13, fontWeight:600, color:"#475569", display:"block", marginBottom:5}}>{lbl}</label>
              <input style={INP} value={val} onChange={e=>set(e.target.value)} placeholder={ph} />
            </div>
          ))}
        </div>
        <div style={{marginBottom:14}}>
          <label style={{fontSize:13, fontWeight:600, color:"#475569", display:"block", marginBottom:5}}>
            수업 내용 추가 설명 <span style={{fontWeight:400, color:"#94A3B8"}}>(선택)</span>
          </label>
          <textarea style={{...INP, height:80, resize:"vertical"}}
            placeholder="오늘 수업에서 배운 내용을 간단히 입력하면 더 좋은 문제가 나옵니다."
            value={memo} onChange={e=>setMemo(e.target.value)} />
        </div>
        <button onClick={generate} disabled={loading}
          style={B(loading?"#A78BFA":PU, undefined, {padding:"11px 24px", cursor:loading?"not-allowed":"pointer"})}>
          {loading ? "⏳ 문제 생성 중..." : "🤖 AI로 문제 생성"}
        </button>
      </div>

      {qs.length > 0 && (
        <div>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14}}>
            <h3 style={{fontSize:15, fontWeight:700, color:DK}}>생성된 문제 ({qs.length}개) — 수정 후 저장하세요</h3>
            <button onClick={save} style={B(saved?"#10B981":PU, undefined, {fontSize:13, padding:"9px 20px"})}>
              {saved ? "✓ 저장됨!" : "💾 저장하기"}
            </button>
          </div>

          {qs.map((q,i) => (
            <div key={i} style={{background:"white", borderRadius:12, padding:20, marginBottom:12,
              boxShadow:"0 1px 4px rgba(0,0,0,0.07)"}}>
              <div style={{display:"flex", alignItems:"center", gap:8, marginBottom:10}}>
                <span style={{background:q.type==="객관식"?"#EFF6FF":"#FFF7ED",
                  color:q.type==="객관식"?"#1D4ED8":"#C2410C",
                  fontSize:12, fontWeight:700, padding:"3px 10px", borderRadius:20}}>{q.type}</span>
                <span style={{fontWeight:700, fontSize:14, color:DK}}>Q{i+1}</span>
              </div>
              <div style={{marginBottom:10}}>
                <label style={{fontSize:12, fontWeight:600, color:"#475569", display:"block", marginBottom:4}}>문제</label>
                <textarea style={{...INP, height:70, resize:"vertical", fontSize:13}}
                  value={q.question} onChange={e=>upQ(i,"question",e.target.value)} />
              </div>
              {q.type==="객관식" && (
                <div style={{marginBottom:10}}>
                  <label style={{fontSize:12, fontWeight:600, color:"#475569", display:"block", marginBottom:6}}>보기</label>
                  {q.options.map((opt,j) => (
                    <div key={j} style={{display:"flex", alignItems:"center", gap:6, marginBottom:5}}>
                      <span style={{fontSize:13, color:"#64748B", minWidth:20}}>{j+1}</span>
                      <input style={{...INP, fontSize:13}} value={opt} onChange={e=>upOpt(i,j,e.target.value)} />
                    </div>
                  ))}
                </div>
              )}
              <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:10}}>
                <div>
                  <label style={{fontSize:12, fontWeight:600, color:"#16A34A", display:"block", marginBottom:4}}>정답</label>
                  <input style={{...INP, fontSize:13, borderColor:"#BBF7D0"}}
                    value={q.answer} onChange={e=>upQ(i,"answer",e.target.value)} />
                </div>
                <div>
                  <label style={{fontSize:12, fontWeight:600, color:PU, display:"block", marginBottom:4}}>해설</label>
                  <input style={{...INP, fontSize:13, borderColor:"#DDD6FE"}}
                    value={q.explanation} onChange={e=>upQ(i,"explanation",e.target.value)} />
                </div>
              </div>
            </div>
          ))}

          <button onClick={save}
            style={B(saved?"#10B981":PU, undefined, {width:"100%", padding:"12px", fontSize:14, marginTop:4})}>
            {saved ? "✓ 저장됨!" : "💾 저장하기"}
          </button>
        </div>
      )}
    </div>
  );
}

// ── 저장된 문제 탭 ────────────────────────────────────────
function ListTab({quizzes, onSave}) {
  const [exp, setExp] = useState({});
  const toggle = id => setExp(p => ({...p, [id]:!p[id]}));
  const del = async id => {
    if (!confirm("삭제하시겠습니까?")) return;
    await onSave(quizzes.filter(q => q.id !== id));
  };

  if (!quizzes.length) return <Empty icon="📝" text="먼저 문제 생성 탭에서 퀴즈를 만들어주세요." />;

  return (
    <div>
      {quizzes.map(q => (
        <div key={q.id} style={{background:"white", borderRadius:12, marginBottom:12,
          boxShadow:"0 1px 4px rgba(0,0,0,0.07)", overflow:"hidden"}}>
          <div style={{padding:"14px 18px", display:"flex", alignItems:"center",
            justifyContent:"space-between", gap:12}}>
            <div style={{flex:1, cursor:"pointer"}} onClick={() => toggle(q.id)}>
              <div style={{fontWeight:700, fontSize:15, color:DK, marginBottom:3}}>{q.title}</div>
              <div style={{fontSize:12, color:"#64748B"}}>
                📚 {q.subject} {q.grade && `· ${q.grade}학년`}{q.cls && ` ${q.cls}반`}
                {` · ${q.questions?.length||0}문제 · ${new Date(q.createdAt).toLocaleDateString()}`}
              </div>
            </div>
            <div style={{display:"flex", gap:6, flexShrink:0}}>
              <button onClick={() => toggle(q.id)}
                style={B("white", PU, {border:`1px solid ${PU}`, fontSize:12, padding:"6px 12px"})}>
                {exp[q.id] ? "접기" : "문제보기"}
              </button>
              <button onClick={() => del(q.id)}
                style={B("#FEF2F2", "#DC2626", {border:"1px solid #FCA5A5", fontSize:12, padding:"6px 12px"})}>
                삭제
              </button>
            </div>
          </div>
          {exp[q.id] && (
            <div style={{borderTop:"1px solid #F1F5F9", padding:"14px 18px", background:"#FAFAFA"}}>
              {q.questions?.map((qu,i) => (
                <div key={i} style={{marginBottom:14, paddingBottom:14,
                  borderBottom: i<q.questions.length-1 ? "1px solid #E2E8F0":"none"}}>
                  <div style={{display:"flex", alignItems:"center", gap:6, marginBottom:6}}>
                    <span style={{background:qu.type==="객관식"?"#EFF6FF":"#FFF7ED",
                      color:qu.type==="객관식"?"#1D4ED8":"#C2410C",
                      fontSize:11, fontWeight:700, padding:"2px 8px", borderRadius:10}}>{qu.type}</span>
                    <span style={{fontSize:13, fontWeight:600, color:DK}}>Q{i+1}. {qu.question}</span>
                  </div>
                  {qu.options?.length>0 && (
                    <div style={{marginLeft:16, marginBottom:6}}>
                      {qu.options.map((o,j) => <div key={j} style={{fontSize:12, color:"#475569", marginBottom:2}}>{o}</div>)}
                    </div>
                  )}
                  <div style={{fontSize:12, color:"#16A34A", marginLeft:16}}>✅ 정답: {qu.answer}</div>
                  <div style={{fontSize:12, color:PU, marginLeft:16, marginTop:2}}>💡 {qu.explanation}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

// ── QR 탭 ─────────────────────────────────────────────────
function QRTab({quizzes}) {
  const [selId, setSelId] = useState(null);
  const sel  = quizzes.find(q => q.id === selId);
  const base = window.location.href.split(/[#?]/)[0];
  const url  = selId ? `${base}?id=${selId}` : "";

  return (
    <div>
      <p style={{color:"#64748B", fontSize:14, marginBottom:16}}>
        퀴즈를 클릭하면 QR코드가 생성됩니다.
      </p>

      {!quizzes.length
        ? <Empty icon="📝" text="먼저 문제 생성 탭에서 퀴즈를 만들어주세요." />
        : (
          <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",
            gap:10, marginBottom:24}}>
            {quizzes.map(q => (
              <div key={q.id} onClick={() => setSelId(q.id)} style={{
                background:"white", borderRadius:12, padding:16, cursor:"pointer",
                border: selId===q.id ? `2px solid ${PU}` : "2px solid transparent",
                boxShadow:"0 1px 4px rgba(0,0,0,0.07)", transition:"all 0.15s"
              }}>
                <div style={{fontSize:26, marginBottom:8}}>📋</div>
                <div style={{fontWeight:700, fontSize:13, color:DK, marginBottom:3, lineHeight:1.4}}>{q.title}</div>
                <div style={{fontSize:11, color:"#94A3B8", marginBottom:6}}>
                  {q.grade && `${q.grade}학년 `}{q.cls && `${q.cls}반`}
                </div>
                <div style={{fontSize:11, background:"#F3F0FF", color:PU, borderRadius:5,
                  padding:"2px 7px", display:"inline-block", fontWeight:700, letterSpacing:1}}>
                  #{sc(q.id)}
                </div>
              </div>
            ))}
          </div>
        )
      }

      {sel && (
        <div style={{background:"white", borderRadius:14, padding:28,
          boxShadow:"0 1px 4px rgba(0,0,0,0.07)", display:"flex",
          flexDirection:"column", alignItems:"center"}}>
          <h3 style={{margin:"0 0 4px", fontSize:17, fontWeight:700, color:DK}}>{sel.title}</h3>
          <p style={{color:"#64748B", fontSize:13, margin:"0 0 4px"}}>📚 {sel.subject}</p>
          <p style={{color:"#94A3B8", fontSize:12, margin:"0 0 20px"}}>QR코드를 학생들에게 보여주세요</p>
          <div style={{padding:10, border:"1px solid #E2E8F0", borderRadius:10, background:"white"}}>
            <QRImg url={url} />
          </div>
          <div style={{marginTop:16, background:"#F3F0FF", borderRadius:10,
            padding:"12px 24px", textAlign:"center"}}>
            <div style={{fontSize:11, color:"#64748B", marginBottom:3}}>QR이 안 될 경우 — 입장 코드</div>
            <div style={{fontSize:26, fontWeight:900, color:PU, letterSpacing:4}}>#{sc(sel.id)}</div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── 결과 확인 탭 ──────────────────────────────────────────
function ResultsTab({quizzes}) {
  const [selId,   setSelId]   = useState("");
  const [results, setResults] = useState([]);

  useEffect(() => {
    if (!selId) return;
    const load = () => DB.getResults(selId).then(setResults);
    load();
    const iv = setInterval(load, 4000);
    return () => clearInterval(iv);
  }, [selId]);

  const quiz   = quizzes.find(q => q.id === selId);
  const sorted = [...results].sort((a,b) => b.studentId.localeCompare(a.studentId));
  const total  = quiz?.questions?.length || 5;

  const download = () => {
    if (!quiz) return;
    const rows = sorted.map(r => ({
      "학번":    r.studentId,
      "점수":    r.submitted ? r.score : "미제출",
      "총점":    total,
      "제출여부": r.submitted ? "제출" : "미제출",
      "제출시간": r.submittedAt || "",
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "퀴즈결과");
    XLSX.writeFile(wb, `${quiz.title}_${quiz.grade||""}학년_${quiz.cls||""}반.xlsx`);
  };

  return (
    <div>
      <div style={{display:"flex", gap:10, marginBottom:18, alignItems:"center", flexWrap:"wrap"}}>
        <select value={selId} onChange={e => setSelId(e.target.value)}
          style={{flex:1, minWidth:200, padding:"10px 12px", border:"1px solid #E2E8F0",
            borderRadius:8, fontSize:13, outline:"none"}}>
          <option value="">📋 퀴즈를 선택하세요</option>
          {quizzes.map(q => <option key={q.id} value={q.id}>{q.title}</option>)}
        </select>
        {selId && (
          <div style={{display:"flex", alignItems:"center", gap:8}}>
            <span style={{fontSize:11, color:"#94A3B8"}}>● 4초마다 자동갱신</span>
            <button onClick={download}
              style={B("#059669", undefined, {fontSize:13, padding:"9px 16px", whiteSpace:"nowrap"})}>
              ⬇ 엑셀 다운로드
            </button>
          </div>
        )}
      </div>

      {selId && !sorted.length && <Empty icon="⏳" text="아직 제출한 학생이 없습니다." />}

      {sorted.length > 0 && (
        <div style={{background:"white", borderRadius:14, overflow:"auto",
          boxShadow:"0 1px 4px rgba(0,0,0,0.07)"}}>
          <table style={{width:"100%", borderCollapse:"collapse", fontSize:13}}>
            <thead>
              <tr style={{background:"#F8FAFC"}}>
                {["학번","점수","제출여부","제출시간"].map(h => (
                  <th key={h} style={{padding:"11px 14px", textAlign:"left", fontWeight:600,
                    color:"#475569", borderBottom:"1px solid #E2E8F0", whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {sorted.map((r,i) => (
                <tr key={r.studentId} style={{borderBottom:"1px solid #E2E8F0",
                  background: i%2===0 ? "white":"#FAFBFC"}}>
                  <td style={{padding:"12px 14px", fontWeight:700, color:DK}}>{r.studentId}</td>
                  <td style={{padding:"12px 14px"}}>
                    {r.submitted
                      ? <span style={{background:"#DCFCE7", color:"#166534",
                          padding:"3px 10px", borderRadius:20, fontWeight:700}}>
                          {r.score}/{total}점
                        </span>
                      : <span style={{color:"#94A3B8", fontSize:12}}>진행중</span>}
                  </td>
                  <td style={{padding:"12px 14px"}}>
                    {r.submitted
                      ? <span style={{color:"#059669", fontWeight:600}}>✅ 제출</span>
                      : <span style={{color:"#94A3B8"}}>미제출</span>}
                  </td>
                  <td style={{padding:"12px 14px", fontSize:12, color:"#64748B"}}>
                    {r.submittedAt ? new Date(r.submittedAt).toLocaleTimeString() : "-"}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════
// 학생 페이지
// ══════════════════════════════════════════════════════════
function StudentPage({qid}) {
  const [quiz,      setQuiz]      = useState(null);
  const [ready,     setReady]     = useState(false);
  const [sid,       setSid]       = useState("");
  const [confirmed, setConfirmed] = useState("");
  const [answers,   setAnswers]   = useState({});
  const [result,    setResult]    = useState(null);
  const [loading,   setLoading]   = useState(false);
  const [done,      setDone]      = useState(false);

  useEffect(() => {
    DB.getQuizzes().then(list => {
      setQuiz(list.find(q => q.id === qid) || null);
      setReady(true);
    });
  }, [qid]);

  useEffect(() => {
    if (!confirmed || !qid) return;
    DB.getResults(qid).then(rs => {
      const ex = rs.find(r => r.studentId === confirmed);
      if (ex?.submitted) { setResult(ex.result); setDone(true); }
    });
  }, [confirmed, qid]);

  const submit = async () => {
    if (!quiz) return;
    const missing = quiz.questions.filter((_,i) => !answers[i]?.trim());
    if (missing.length) return alert(`${missing.length}개 문제에 답을 입력해주세요.`);
    setLoading(true);
    try {
      const prompt = `아래 퀴즈 문제와 학생 답변을 채점하세요.
${quiz.questions.map((q,i) =>
  `문제${i+1}[${q.type}]: ${q.question}\n${q.options?.length ? q.options.join(" / "):""}\n정답: ${q.answer}\n학생답변: ${answers[i]||""}`
).join("\n\n")}
아래 JSON 배열만 출력:
[{"correct":true또는false,"feedback":"채점이유와 해설"}]`;

      const raw    = await gemini(prompt);
      const graded = parseJSON(raw) || quiz.questions.map(()=>({correct:false,feedback:"채점 오류"}));
      const score  = graded.filter(g=>g.correct).length;
      const res    = { questions:quiz.questions, answers, graded, score };
      setResult(res);

      await DB.saveResult(qid, {
        studentId: confirmed, score, result: res,
        submitted: true, submittedAt: new Date().toISOString()
      });
    } catch(e) { alert("제출 오류: " + e.message); }
    setLoading(false);
  };

  if (!ready) return <Center><div style={{color:"#94A3B8"}}>로딩 중...</div></Center>;
  if (!quiz)  return (
    <Center>
      <div style={{textAlign:"center", color:"#94A3B8"}}>
        <div style={{fontSize:40}}>🔍</div>
        <div style={{marginTop:10}}>퀴즈를 찾을 수 없습니다.</div>
      </div>
    </Center>
  );

  // 학번 입력 화면
  if (!confirmed) return (
    <Center>
      <div style={{background:"white", borderRadius:20, padding:32, width:310,
        boxShadow:"0 16px 48px rgba(0,0,0,0.15)", textAlign:"center"}}>
        <div style={{fontSize:40, marginBottom:10}}>🧩</div>
        <div style={{fontWeight:900, fontSize:18, color:PU, marginBottom:3}}>ASSESS AI - QUIZ</div>
        <div style={{fontWeight:700, fontSize:14, color:DK, marginBottom:3}}>{quiz.title}</div>
        <div style={{fontSize:12, color:"#64748B", marginBottom:20}}>
          📚 {quiz.subject} · {quiz.questions?.length||0}문제
        </div>
        <label style={{display:"block", textAlign:"left", fontSize:12,
          fontWeight:600, color:"#475569", marginBottom:6}}>
          학년-반-번호를 입력하세요
        </label>
        <input value={sid} onChange={e=>setSid(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&sid.trim()&&setConfirmed(sid.trim())}
          placeholder="예: 3-2-15" autoFocus
          style={{...INP, fontSize:20, textAlign:"center", fontWeight:700,
            padding:"12px", borderRadius:10}} />
        <button onClick={() => sid.trim() && setConfirmed(sid.trim())}
          style={B(PU, undefined, {width:"100%", marginTop:10, padding:"12px",
            fontSize:14, borderRadius:10})}>
          시작하기
        </button>
      </div>
    </Center>
  );

  // 결과 화면
  if (result) return (
    <div style={{minHeight:"100vh", background:"#F5F3FF"}}>
      <div style={{background:PU, color:"white", padding:"12px 16px"}}>
        <div style={{fontWeight:900, fontSize:16}}>ASSESS AI - QUIZ</div>
        <div style={{fontSize:11, opacity:0.75}}>{quiz.title} · {confirmed}</div>
      </div>
      <div style={{maxWidth:600, margin:"0 auto", padding:"20px 16px"}}>
        <div style={{background:"white", borderRadius:16, padding:24, textAlign:"center",
          marginBottom:20, boxShadow:"0 2px 8px rgba(0,0,0,0.08)"}}>
          <div style={{fontSize:48, marginBottom:8}}>🎉</div>
          <div style={{fontSize:28, fontWeight:900, color:PU, marginBottom:4}}>
            {result.score}/{quiz.questions?.length||0}점
          </div>
          <div style={{fontSize:14, color:"#64748B"}}>
            {done ? "이미 제출한 퀴즈입니다." : "제출 완료!"}
          </div>
        </div>

        {result.questions?.map((q,i) => {
          const g = result.graded?.[i];
          return (
            <div key={i} style={{background:"white", borderRadius:12, padding:18, marginBottom:12,
              boxShadow:"0 1px 4px rgba(0,0,0,0.06)",
              borderLeft:`4px solid ${g?.correct?"#10B981":"#EF4444"}`}}>
              <div style={{display:"flex", alignItems:"center", gap:6, marginBottom:8}}>
                <span style={{fontSize:16}}>{g?.correct ? "✅":"❌"}</span>
                <span style={{fontSize:12, background:q.type==="객관식"?"#EFF6FF":"#FFF7ED",
                  color:q.type==="객관식"?"#1D4ED8":"#C2410C",
                  fontWeight:700, padding:"2px 8px", borderRadius:10}}>{q.type}</span>
                <span style={{fontWeight:700, fontSize:13, color:DK}}>Q{i+1}</span>
              </div>
              <div style={{fontSize:13, color:DK, marginBottom:8, lineHeight:1.6}}>{q.question}</div>
              {q.options?.length>0 && (
                <div style={{marginBottom:8}}>
                  {q.options.map((o,j) => <div key={j} style={{fontSize:12, color:"#475569", padding:"2px 0"}}>{o}</div>)}
                </div>
              )}
              <div style={{fontSize:12, color:"#475569", marginBottom:4}}>
                내 답변: <strong>{result.answers?.[i]||"(미입력)"}</strong>
              </div>
              <div style={{fontSize:12, color:"#16A34A", marginBottom:4}}>
                정답: <strong>{q.answer}</strong>
              </div>
              {g?.feedback && (
                <div style={{fontSize:12, color:PU, background:"#F3F0FF",
                  borderRadius:8, padding:"8px 10px", marginTop:6, lineHeight:1.6}}>
                  💡 {g.feedback}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );

  // 문제 풀기 화면
  return (
    <div style={{minHeight:"100vh", background:"#F5F3FF"}}>
      <div style={{background:PU, color:"white", padding:"12px 16px",
        position:"sticky", top:0, zIndex:10}}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
          <div>
            <div style={{fontWeight:900, fontSize:15}}>ASSESS AI - QUIZ</div>
            <div style={{fontSize:11, opacity:0.75}}>{quiz.title}</div>
          </div>
          <div style={{fontSize:11, opacity:0.75}}>👤 {confirmed} · {quiz.questions?.length||0}문제</div>
        </div>
      </div>

      <div style={{maxWidth:600, margin:"0 auto", padding:16}}>
        {quiz.questions?.map((q,i) => (
          <div key={i} style={{background:"white", borderRadius:12, padding:18, marginBottom:14,
            boxShadow:"0 1px 4px rgba(0,0,0,0.07)"}}>
            <div style={{display:"flex", alignItems:"center", gap:6, marginBottom:10}}>
              <span style={{background:q.type==="객관식"?"#EFF6FF":"#FFF7ED",
                color:q.type==="객관식"?"#1D4ED8":"#C2410C",
                fontSize:11, fontWeight:700, padding:"2px 8px", borderRadius:10}}>{q.type}</span>
              <span style={{fontWeight:700, fontSize:14, color:DK}}>Q{i+1}</span>
            </div>
            <div style={{fontSize:14, color:DK, marginBottom:12, lineHeight:1.7}}>{q.question}</div>
            {q.type === "객관식"
              ? (
                <div>
                  {q.options?.map((opt,j) => (
                    <div key={j} onClick={() => setAnswers(p=>({...p,[i]:opt}))} style={{
                      padding:"10px 14px", borderRadius:9, marginBottom:7, cursor:"pointer",
                      border:`2px solid ${answers[i]===opt ? PU:"#E2E8F0"}`,
                      background: answers[i]===opt ? "#F3F0FF":"white",
                      fontSize:13, color: answers[i]===opt ? PU:DK,
                      fontWeight: answers[i]===opt ? 700:400, transition:"all 0.12s"
                    }}>{opt}</div>
                  ))}
                </div>
              ) : (
                <textarea value={answers[i]||""} onChange={e=>setAnswers(p=>({...p,[i]:e.target.value}))}
                  placeholder="답을 입력하세요..."
                  style={{...INP, height:80, resize:"vertical", fontSize:13, borderRadius:9}} />
              )
            }
          </div>
        ))}

        <button onClick={submit} disabled={loading} style={B(
          loading ? "#A78BFA":PU, undefined,
          {width:"100%", padding:"13px", fontSize:15, borderRadius:10,
           marginTop:4, cursor:loading?"not-allowed":"pointer"}
        )}>
          {loading ? "⏳ 채점 중..." : "✅ 제출하기"}
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
