<script type="text/babel">
const { useState, useEffect, useRef } = React;

const FIREBASE_URL = "https://assess-ai-77355-default-rtdb.firebaseio.com";

const PU = "#7C3AED", DK = "#1E293B";
const B = (bg, col="white", ex={}) => ({padding:"10px 20px",background:bg,color:col,border:"none",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:14,...ex});
const INP = {padding:"10px 12px",border:"1px solid #E2E8F0",borderRadius:8,fontSize:14,width:"100%",boxSizing:"border-box",outline:"none",fontFamily:"inherit"};
const sc = id => id ? id.slice(-6).toUpperCase() : "";

let GEMINI_KEY = "";
async function loadGeminiKey() {
  try {
    const r = await fetch(`${FIREBASE_URL}/config/geminiKey.json`);
    const d = await r.json();
    if (d && typeof d === "string") { GEMINI_KEY = d; return true; }
    return false;
  } catch { return false; }
}

// ── Firebase (교사별 분리) ─────────────────────────────────
const DB = {
  async getQuizzes(uid) {
    try {
      const r = await fetch(`${FIREBASE_URL}/quizzes/${uid}.json`);
      const d = await r.json();
      if (!d) return [];
      return Object.values(d).sort((a,b) => new Date(b.createdAt)-new Date(a.createdAt));
    } catch { return []; }
  },
  async saveQuizzes(uid, arr) {
    const obj = {}; arr.forEach(q => { obj[q.id] = q; });
    await fetch(`${FIREBASE_URL}/quizzes/${uid}.json`, {method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(obj)});
  },
  async findQuiz(qid) {
    try {
      const r = await fetch(`${FIREBASE_URL}/quizzes.json`);
      const d = await r.json();
      if (!d) return null;
      for (const uid of Object.keys(d)) {
        if (d[uid][qid]) return { ...d[uid][qid], _ownerUid: uid };
      }
      return null;
    } catch { return null; }
  },
  async findQuizByCode(code) {
    try {
      const r = await fetch(`${FIREBASE_URL}/quizzes.json`);
      const d = await r.json();
      if (!d) return null;
      for (const uid of Object.keys(d)) {
        for (const qid of Object.keys(d[uid])) {
          if (sc(qid) === code.toUpperCase()) return { ...d[uid][qid], _ownerUid: uid };
        }
      }
      return null;
    } catch { return null; }
  },
  async getResults(uid, qid) {
    try {
      const r = await fetch(`${FIREBASE_URL}/qresults/${uid}/${qid}.json`);
      const d = await r.json();
      if (!d) return [];
      return Object.values(d);
    } catch { return []; }
  },
  async saveResult(uid, qid, result) {
    const key = result.studentId.replace(/[.#$/[\]\s]/g, "_");
    await fetch(`${FIREBASE_URL}/qresults/${uid}/${qid}/${key}.json`, {method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(result)});
  },
};

async function gemini(prompt) {
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_KEY}`, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      contents: [{role:"user", parts:[{text:prompt}]}],
      generationConfig: {maxOutputTokens:2000, temperature:0, thinkingConfig:{thinkingBudget:0}}
    })
  });
  const d = await res.json();
  if (d.error) throw new Error(d.error.message);
  return d.candidates[0].content.parts.filter(p=>p.text).map(p=>p.text).join("");
}

function parseJSON(raw) {
  const clean = raw.replace(/```json|```/g,"").trim();
  const m = clean.match(/[\[{][\s\S]*[\]}]/);
  return m ? JSON.parse(m[0]) : null;
}

function Empty({icon,text}) { return <div style={{textAlign:"center",padding:48,color:"#94A3B8"}}><div style={{fontSize:36,marginBottom:10}}>{icon}</div><div style={{fontSize:14}}>{text}</div></div>; }
function Center({children}) { return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:"#F5F3FF"}}>{children}</div>; }
function QRImg({url}) {
  const ref = useRef(null);
  useEffect(() => {
    if (!url || !ref.current) return;
    ref.current.innerHTML = "";
    if (window.QRCode) new window.QRCode(ref.current, {text:url,width:240,height:240});
  }, [url]);
  return <div ref={ref} style={{lineHeight:0}} />;
}

// ══════════════════════════════════════════════════════════
// ROOT
// ══════════════════════════════════════════════════════════
function App() {
  const [page, setPage] = useState("boot");
  const [qid,  setQid]  = useState(null);
  const [ownerUid, setOwnerUid] = useState(null);
  const [user, setUser] = useState(null);

  useEffect(() => {
    const go = async () => {
      await loadGeminiKey();
      const p = new URLSearchParams(window.location.search);
      const id = p.get("id"), code = p.get("code");

      if (id) {
        const q = await DB.findQuiz(id);
        if (q) { setQid(id); setOwnerUid(q._ownerUid); setPage("student"); return; }
      }
      if (code) {
        const q = await DB.findQuizByCode(code);
        if (q) { setQid(q.id); setOwnerUid(q._ownerUid); setPage("student"); return; }
      }

      firebase.auth().onAuthStateChanged(u => {
        setUser(u);
        setPage(u ? "teacher" : "login");
      });
    };
    go();
  }, []);

  if (page === "boot")    return <Center><div style={{color:"#94A3B8"}}>로딩 중...</div></Center>;
  if (page === "student") return <StudentPage quizId={qid} ownerUid={ownerUid}/>;
  if (page === "login")   return <LoginPage/>;
  return <TeacherApp user={user}/>;
}

// ══════════════════════════════════════════════════════════
// 로그인 페이지
// ══════════════════════════════════════════════════════════

  return (
    <Center>
      <div style={{background:"white",borderRadius:20,padding:40,width:400,boxShadow:"0 16px 48px rgba(0,0,0,0.12)",textAlign:"center"}}>
        <div style={{fontSize:48,marginBottom:12}}>🧩</div>
        <h1 style={{fontSize:26,fontWeight:900,color:PU,marginBottom:8}}>ASSESS AI - QUIZ</h1>
        <p style={{color:"#64748B",fontSize:14,marginBottom:28,lineHeight:1.7}}>
          AI 기반 형성평가 퀴즈 시스템<br/>
          <span style={{fontSize:12,color:"#94A3B8"}}>교사용 관리 페이지</span>
        </p>
        <button onClick={login} style={{
          width:"100%",padding:"14px",background:"white",border:"1px solid #E2E8F0",
          borderRadius:10,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:12,
          fontSize:15,fontWeight:600,color:"#334155",boxShadow:"0 1px 3px rgba(0,0,0,0.06)"
        }}>
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Google 계정으로 로그인
        </button>
        <p style={{fontSize:11,color:"#94A3B8",marginTop:16,lineHeight:1.7}}>
          로그인하면 본인이 만든 퀴즈만 관리할 수 있습니다.<br/>
          학생들은 로그인 없이 QR 코드로 접속합니다.
        </p>
      </div>
    </Center>
  );
}

// ══════════════════════════════════════════════════════════
// 교사 앱
// ══════════════════════════════════════════════════════════
function TeacherApp({user}) {
  const [tab, setTab] = useState("generate");
  const [quizzes, setQuizzes] = useState([]);
  const [ready, setReady] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);

  useEffect(() => { DB.getQuizzes(user.uid).then(q => { setQuizzes(q); setReady(true); }); }, [user.uid]);

  const saveAll = async next => { await DB.saveQuizzes(user.uid, next); setQuizzes(next); };
  const logout = async () => { await firebase.auth().signOut(); window.location.reload(); };

  const TABS = [["generate","✨ 문제 생성"],["list","📚 저장된 문제"],["qr","📱 QR코드"],["results","📊 결과 확인"]];

  return (
    <div style={{minHeight:"100vh",background:"#F5F3FF"}}>
      <header style={{background:PU,color:"white",padding:"0 20px",display:"flex",alignItems:"center",justifyContent:"space-between",height:54}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:18,fontWeight:900}}>ASSESS AI - QUIZ</span>
          <span style={{height:16,width:1,background:"rgba(255,255,255,0.3)"}}/>
          <span style={{fontSize:12,opacity:0.7}}>교사용 관리 페이지</span>
        </div>
        <div style={{position:"relative"}}>
          <button onClick={()=>setMenuOpen(!menuOpen)} style={{display:"flex",alignItems:"center",gap:8,background:"rgba(255,255,255,0.15)",border:"none",borderRadius:20,padding:"4px 12px 4px 4px",cursor:"pointer",color:"white"}}>
            {user.photoURL ? <img src={user.photoURL} alt="" style={{width:28,height:28,borderRadius:"50%"}}/> : <div style={{width:28,height:28,borderRadius:"50%",background:"rgba(255,255,255,0.3)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>👤</div>}
            <span style={{fontSize:12,fontWeight:600}}>{user.displayName||"선생님"}</span>
          </button>
          {menuOpen && (
            <div style={{position:"absolute",top:"110%",right:0,background:"white",borderRadius:10,boxShadow:"0 8px 24px rgba(0,0,0,0.15)",minWidth:200,zIndex:100,overflow:"hidden"}}>
              <div style={{padding:"12px 14px",borderBottom:"1px solid #E2E8F0"}}>
                <div style={{fontSize:13,fontWeight:700,color:DK}}>{user.displayName}</div>
                <div style={{fontSize:11,color:"#64748B",marginTop:2}}>{user.email}</div>
              </div>
              <button onClick={logout} style={{width:"100%",padding:"11px 14px",border:"none",background:"none",cursor:"pointer",textAlign:"left",fontSize:13,color:"#DC2626",fontWeight:600}}>
                🚪 로그아웃
              </button>
            </div>
          )}
        </div>
      </header>

      <div style={{background:"white",borderBottom:"1px solid #E2E8F0",display:"flex",paddingLeft:12}}>
        {TABS.map(([id,label]) => (
          <button key={id} onClick={() => setTab(id)} style={{padding:"12px 16px",border:"none",background:"none",cursor:"pointer",fontWeight:tab===id?700:500,fontSize:13,color:tab===id?PU:"#64748B",borderBottom:tab===id?`2px solid ${PU}`:"2px solid transparent"}}>{label}</button>
        ))}
      </div>
      <main style={{maxWidth:960,margin:"0 auto",padding:"24px 20px"}}>
        {!ready ? <Empty icon="⏳" text="로딩 중..." /> : <>
          {tab==="generate" && <GenerateTab quizzes={quizzes} onSave={saveAll} onSwitch={() => setTab("list")} />}
          {tab==="list"     && <ListTab quizzes={quizzes} onSave={saveAll} />}
          {tab==="qr"       && <QRTab quizzes={quizzes} />}
          {tab==="results"  && <ResultsTab quizzes={quizzes} uid={user.uid} />}
        </>}
      </main>
    </div>
  );
}

function GenerateTab({quizzes, onSave, onSwitch}) {
  const [title,setTitle]=useState(""); const [subject,setSubject]=useState("");
  const [school,setSchool]=useState(""); const [grade,setGrade]=useState("");
  const [memo,setMemo]=useState(""); const [loading,setLoading]=useState(false);
  const [qs,setQs]=useState([]); const [saved,setSaved]=useState(false);
  const [mcCount,setMcCount]=useState(3); const [saCount,setSaCount]=useState(2);

  const generate = async () => {
    if (!title.trim()||!subject.trim()) return alert("제목과 수업 주제를 입력해주세요.");
    const total = mcCount + saCount;
    if (total === 0) return alert("선택형 또는 서술형 중 최소 1문제는 있어야 합니다.");
    setLoading(true); setQs([]); setSaved(false);
    try {
      let typeList = [];
      for (let i=0; i<mcCount; i++) typeList.push("객관식");
      for (let i=0; i<saCount; i++) typeList.push("주관식");

      const prompt = `중학교 과학 수업 형성평가 문제 ${total}개를 출제하세요.
수업 주제: ${subject}
${memo ? "수업 내용: "+memo : ""}
조건: 객관식 ${mcCount}문제(보기 4개), 주관식 ${saCount}문제, 중학생 수준.
아래 JSON 배열만 출력하고 다른 텍스트 없이. 각 문제의 type은 순서대로 [${typeList.map(t=>`"${t}"`).join(",")}] 로 설정:
[
${typeList.map(t => t==="객관식"
  ? `  {"type":"객관식","question":"문제내용","options":["①보기1","②보기2","③보기3","④보기4"],"answer":"①보기1","explanation":"해설"}`
  : `  {"type":"주관식","question":"문제내용","options":[],"answer":"정답","explanation":"해설"}`
).join(",\n")}
]`;
      const raw = await gemini(prompt);
      const parsed = parseJSON(raw);
      if (parsed) setQs(parsed);
      else alert("문제 생성 실패. 다시 시도해주세요.");
    } catch(e) { alert("오류: "+e.message); }
    setLoading(false);
  };

  const upQ=(i,f,v)=>{const n=[...qs];n[i]={...n[i],[f]:v};setQs(n);};
  const upOpt=(i,j,v)=>{const n=[...qs];n[i].options[j]=v;setQs(n);};

  const save = async () => {
    if (!qs.length) return;
    const quiz = {id:Date.now().toString(),title,subject,school,grade,questions:qs,createdAt:new Date().toISOString()};
    await onSave([quiz,...quizzes]);
    setSaved(true); setTimeout(()=>{setSaved(false);onSwitch();},1200);
  };

  const Counter = ({label, value, setValue, color}) => (
    <div style={{flex:1, background:color.bg, borderRadius:12, padding:"14px 16px", border:`2px solid ${color.border}`}}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10}}>
        <div style={{fontWeight:700, fontSize:13, color:color.text}}>{label}</div>
        <div style={{fontSize:22, fontWeight:900, color:color.text}}>{value}<span style={{fontSize:13, fontWeight:500, color:"#94A3B8"}}>/5</span></div>
      </div>
      <div style={{display:"flex", gap:4}}>
        {[0,1,2,3,4,5].map(n => (
          <button key={n} onClick={()=>setValue(n)} style={{
            flex:1, padding:"7px 0", border:"none", cursor:"pointer", borderRadius:6,
            background: value===n ? color.text : "white",
            color: value===n ? "white" : color.text,
            fontWeight:700, fontSize:13, transition:"all 0.15s"
          }}>{n}</button>
        ))}
      </div>
    </div>
  );

  return (
    <div>
      <div style={{background:"white",borderRadius:14,padding:24,boxShadow:"0 1px 4px rgba(0,0,0,0.07)",marginBottom:20}}>
        <h2 style={{margin:"0 0 18px",fontSize:16,fontWeight:700,color:DK}}>✨ AI 문제 자동 생성</h2>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
          <div><label style={{fontSize:13,fontWeight:600,color:"#475569",display:"block",marginBottom:5}}>퀴즈 제목 *</label><input style={INP} placeholder="예: 빛의 굴절(2-1)" value={title} onChange={e=>setTitle(e.target.value)}/></div>
          <div><label style={{fontSize:13,fontWeight:600,color:"#475569",display:"block",marginBottom:5}}>수업 주제 *</label><input style={INP} placeholder="예: 볼록렌즈와 오목렌즈" value={subject} onChange={e=>setSubject(e.target.value)}/></div>
          <div>
            <label style={{fontSize:13,fontWeight:600,color:"#475569",display:"block",marginBottom:5}}>학교급</label>
            <select value={school} onChange={e=>setSchool(e.target.value)} style={{...INP, background:"white", cursor:"pointer"}}>
              <option value="">선택하세요</option>
              <option value="초등학교">초등학교</option>
              <option value="중학교">중학교</option>
              <option value="고등학교">고등학교</option>
            </select>
          </div>
          <div><label style={{fontSize:13,fontWeight:600,color:"#475569",display:"block",marginBottom:5}}>학년</label><input style={INP} placeholder="예: 3" value={grade} onChange={e=>setGrade(e.target.value)}/></div>
        </div>

        <div style={{marginBottom:14}}>
          <label style={{fontSize:13,fontWeight:600,color:"#475569",display:"block",marginBottom:8}}>📝 문항 구성 (총 {mcCount + saCount}문제)</label>
          <div style={{display:"flex", gap:10}}>
            <Counter
              label="선택형 (객관식)"
              value={mcCount} setValue={setMcCount}
              color={{bg:"#EFF6FF", border:"#BFDBFE", text:"#1D4ED8"}}
            />
            <Counter
              label="서술형 (주관식)"
              value={saCount} setValue={setSaCount}
              color={{bg:"#FFF7ED", border:"#FED7AA", text:"#C2410C"}}
            />
          </div>
        </div>

        <div style={{marginBottom:14}}>
          <label style={{fontSize:13,fontWeight:600,color:"#475569",display:"block",marginBottom:5}}>수업 내용 추가 설명 <span style={{fontWeight:400,color:"#94A3B8"}}>(선택)</span></label>
          <textarea style={{...INP,height:80,resize:"vertical"}} placeholder="오늘 수업에서 배운 내용을 간단히 입력하면 더 좋은 문제가 나옵니다." value={memo} onChange={e=>setMemo(e.target.value)}/>
        </div>
        <button onClick={generate} disabled={loading} style={B(loading?"#A78BFA":PU,undefined,{padding:"11px 24px",cursor:loading?"not-allowed":"pointer"})}>
          {loading?"⏳ 문제 생성 중...":"🤖 AI로 문제 생성"}
        </button>
      </div>

      {qs.length>0 && (
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <h3 style={{fontSize:15,fontWeight:700,color:DK}}>생성된 문제 ({qs.length}개) — 수정 후 저장하세요</h3>
            <button onClick={save} style={B(saved?"#10B981":PU,undefined,{fontSize:13,padding:"9px 20px"})}>{saved?"✓ 저장됨!":"💾 저장하기"}</button>
          </div>
          {qs.map((q,i) => (
            <div key={i} style={{background:"white",borderRadius:12,padding:20,marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,0.07)"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                <span style={{background:q.type==="객관식"?"#EFF6FF":"#FFF7ED",color:q.type==="객관식"?"#1D4ED8":"#C2410C",fontSize:12,fontWeight:700,padding:"3px 10px",borderRadius:20}}>{q.type}</span>
                <span style={{fontWeight:700,fontSize:14,color:DK}}>Q{i+1}</span>
              </div>
              <div style={{marginBottom:10}}>
                <label style={{fontSize:12,fontWeight:600,color:"#475569",display:"block",marginBottom:4}}>문제</label>
                <textarea style={{...INP,height:70,resize:"vertical",fontSize:13}} value={q.question} onChange={e=>upQ(i,"question",e.target.value)}/>
              </div>
              {q.type==="객관식" && (
                <div style={{marginBottom:10}}>
                  <label style={{fontSize:12,fontWeight:600,color:"#475569",display:"block",marginBottom:6}}>보기</label>
                  {q.options.map((opt,j) => (
                    <div key={j} style={{display:"flex",alignItems:"center",gap:6,marginBottom:5}}>
                      <span style={{fontSize:13,color:"#64748B",minWidth:20}}>{j+1}</span>
                      <input style={{...INP,fontSize:13}} value={opt} onChange={e=>upOpt(i,j,e.target.value)}/>
                    </div>
                  ))}
                </div>
              )}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                <div><label style={{fontSize:12,fontWeight:600,color:"#16A34A",display:"block",marginBottom:4}}>정답</label><input style={{...INP,fontSize:13,borderColor:"#BBF7D0"}} value={q.answer} onChange={e=>upQ(i,"answer",e.target.value)}/></div>
                <div><label style={{fontSize:12,fontWeight:600,color:PU,display:"block",marginBottom:4}}>해설</label><input style={{...INP,fontSize:13,borderColor:"#DDD6FE"}} value={q.explanation} onChange={e=>upQ(i,"explanation",e.target.value)}/></div>
              </div>
            </div>
          ))}
          <button onClick={save} style={B(saved?"#10B981":PU,undefined,{width:"100%",padding:"12px",fontSize:14,marginTop:4})}>{saved?"✓ 저장됨!":"💾 저장하기"}</button>
        </div>
      )}
    </div>
  );
}

function ListTab({quizzes, onSave}) {
  const [exp,setExp]=useState({});
  const toggle=id=>setExp(p=>({...p,[id]:!p[id]}));
  const del=async id=>{if(!confirm("삭제하시겠습니까?"))return;await onSave(quizzes.filter(q=>q.id!==id));};
  if (!quizzes.length) return <Empty icon="📝" text="먼저 문제 생성 탭에서 퀴즈를 만들어주세요."/>;
  return (
    <div>
      {quizzes.map(q => (
        <div key={q.id} style={{background:"white",borderRadius:12,marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,0.07)",overflow:"hidden"}}>
          <div style={{padding:"14px 18px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12}}>
            <div style={{flex:1,cursor:"pointer"}} onClick={() => toggle(q.id)}>
              <div style={{fontWeight:700,fontSize:15,color:DK,marginBottom:3}}>{q.title}</div>
              <div style={{fontSize:12,color:"#64748B"}}>📚 {q.subject} {q.school&&`· ${q.school}`}{q.grade&&` ${q.grade}학년`} · {q.questions?.length||0}문제 · {new Date(q.createdAt).toLocaleDateString()}</div>
            </div>
            <div style={{display:"flex",gap:6,flexShrink:0}}>
              <button onClick={()=>toggle(q.id)} style={B("white",PU,{border:`1px solid ${PU}`,fontSize:12,padding:"6px 12px"})}>{exp[q.id]?"접기":"문제보기"}</button>
              <button onClick={()=>del(q.id)} style={B("#FEF2F2","#DC2626",{border:"1px solid #FCA5A5",fontSize:12,padding:"6px 12px"})}>삭제</button>
            </div>
          </div>
          {exp[q.id] && (
            <div style={{borderTop:"1px solid #F1F5F9",padding:"14px 18px",background:"#FAFAFA"}}>
              {q.questions?.map((qu,i) => (
                <div key={i} style={{marginBottom:14,paddingBottom:14,borderBottom:i<q.questions.length-1?"1px solid #E2E8F0":"none"}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
                    <span style={{background:qu.type==="객관식"?"#EFF6FF":"#FFF7ED",color:qu.type==="객관식"?"#1D4ED8":"#C2410C",fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:10}}>{qu.type}</span>
                    <span style={{fontSize:13,fontWeight:600,color:DK}}>Q{i+1}. {qu.question}</span>
                  </div>
                  {qu.options?.length>0 && <div style={{marginLeft:16,marginBottom:6}}>{qu.options.map((o,j)=><div key={j} style={{fontSize:12,color:"#475569",marginBottom:2}}>{o}</div>)}</div>}
                  <div style={{fontSize:12,color:"#16A34A",marginLeft:16}}>✅ 정답: {qu.answer}</div>
                  <div style={{fontSize:12,color:PU,marginLeft:16,marginTop:2}}>💡 {qu.explanation}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

function QRTab({quizzes}) {
  const [selId,setSelId]=useState(null);
  const sel = quizzes.find(q=>q.id===selId);
  const base = window.location.href.split(/[#?]/)[0];
  const url  = selId ? `${base}?id=${selId}` : "";
  return (
    <div>
      <p style={{color:"#64748B",fontSize:14,marginBottom:16}}>퀴즈를 클릭하면 QR코드가 생성됩니다.</p>
      {!quizzes.length ? <Empty icon="📝" text="먼저 문제 생성 탭에서 퀴즈를 만들어주세요."/> : (
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:10,marginBottom:24}}>
          {quizzes.map(q => (
            <div key={q.id} onClick={()=>setSelId(q.id)} style={{background:"white",borderRadius:12,padding:16,cursor:"pointer",border:selId===q.id?`2px solid ${PU}`:"2px solid transparent",boxShadow:"0 1px 4px rgba(0,0,0,0.07)",transition:"all 0.15s"}}>
              <div style={{fontSize:26,marginBottom:8}}>📋</div>
              <div style={{fontWeight:700,fontSize:13,color:DK,marginBottom:3,lineHeight:1.4}}>{q.title}</div>
              <div style={{fontSize:11,color:"#94A3B8",marginBottom:6}}>{q.school&&`${q.school} `}{q.grade&&`${q.grade}학년`}</div>
              <div style={{fontSize:11,background:"#F3F0FF",color:PU,borderRadius:5,padding:"2px 7px",display:"inline-block",fontWeight:700,letterSpacing:1}}>#{sc(q.id)}</div>
            </div>
          ))}
        </div>
      )}
      {sel && (
        <div style={{background:"white",borderRadius:14,padding:28,boxShadow:"0 1px 4px rgba(0,0,0,0.07)",display:"flex",flexDirection:"column",alignItems:"center"}}>
          <h3 style={{margin:"0 0 4px",fontSize:17,fontWeight:700,color:DK}}>{sel.title}</h3>
          <p style={{color:"#64748B",fontSize:13,margin:"0 0 4px"}}>📚 {sel.subject}</p>
          <p style={{color:"#94A3B8",fontSize:12,margin:"0 0 20px"}}>QR코드를 학생들에게 보여주세요</p>
          <div style={{padding:10,border:"1px solid #E2E8F0",borderRadius:10,background:"white"}}><QRImg url={url}/></div>
          <div style={{marginTop:16,background:"#F3F0FF",borderRadius:10,padding:"12px 24px",textAlign:"center"}}>
            <div style={{fontSize:11,color:"#64748B",marginBottom:3}}>QR이 안 될 경우 — 입장 코드</div>
            <div style={{fontSize:26,fontWeight:900,color:PU,letterSpacing:4}}>#{sc(sel.id)}</div>
          </div>
        </div>
      )}
    </div>
  );
}

function ResultsTab({quizzes, uid}) {
  const [selId,setSelId]=useState(""); const [results,setResults]=useState([]);
  useEffect(()=>{if(!selId)return;const load=()=>DB.getResults(uid, selId).then(setResults);load();const iv=setInterval(load,4000);return()=>clearInterval(iv);},[selId, uid]);
  const quiz=quizzes.find(q=>q.id===selId);
  const sorted=[...results].sort((a,b)=>b.studentId.localeCompare(a.studentId));
  const total=quiz?.questions?.length||5;
  const download=()=>{
    if(!quiz)return;
    const rows=sorted.map(r=>({"학번":r.studentId,"점수":r.submitted?r.score:"미제출","총점":total,"제출여부":r.submitted?"제출":"미제출","제출시간":r.submittedAt||""}));
    const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"퀴즈결과");
    XLSX.writeFile(wb,`${quiz.title}_${quiz.school||""}_${quiz.grade||""}학년.xlsx`);
  };
  return (
    <div>
      <div style={{display:"flex",gap:10,marginBottom:18,alignItems:"center",flexWrap:"wrap"}}>
        <select value={selId} onChange={e=>setSelId(e.target.value)} style={{flex:1,minWidth:200,padding:"10px 12px",border:"1px solid #E2E8F0",borderRadius:8,fontSize:13,outline:"none"}}>
          <option value="">📋 퀴즈를 선택하세요</option>
          {quizzes.map(q=><option key={q.id} value={q.id}>{q.title}</option>)}
        </select>
        {selId&&<div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:11,color:"#94A3B8"}}>● 4초마다 자동갱신</span>
          <button onClick={download} style={B("#059669",undefined,{fontSize:13,padding:"9px 16px",whiteSpace:"nowrap"})}>⬇ 엑셀 다운로드</button>
        </div>}
      </div>
      {selId&&!sorted.length&&<Empty icon="⏳" text="아직 제출한 학생이 없습니다."/>}
      {sorted.length>0&&(
        <div style={{background:"white",borderRadius:14,overflow:"auto",boxShadow:"0 1px 4px rgba(0,0,0,0.07)"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr style={{background:"#F8FAFC"}}>
              {["학번","점수","제출여부","제출시간"].map(h=>(<th key={h} style={{padding:"11px 14px",textAlign:"left",fontWeight:600,color:"#475569",borderBottom:"1px solid #E2E8F0",whiteSpace:"nowrap"}}>{h}</th>))}
            </tr></thead>
            <tbody>
              {sorted.map((r,i)=>(
                <tr key={r.studentId} style={{borderBottom:"1px solid #E2E8F0",background:i%2===0?"white":"#FAFBFC"}}>
                  <td style={{padding:"12px 14px",fontWeight:700,color:DK}}>{r.studentId}</td>
                  <td style={{padding:"12px 14px"}}>{r.submitted?<span style={{background:"#DCFCE7",color:"#166534",padding:"3px 10px",borderRadius:20,fontWeight:700}}>{r.score}/{total}점</span>:<span style={{color:"#94A3B8",fontSize:12}}>진행중</span>}</td>
                  <td style={{padding:"12px 14px"}}>{r.submitted?<span style={{color:"#059669",fontWeight:600}}>✅ 제출</span>:<span style={{color:"#94A3B8"}}>미제출</span>}</td>
                  <td style={{padding:"12px 14px",fontSize:12,color:"#64748B"}}>{r.submittedAt?new Date(r.submittedAt).toLocaleTimeString():"-"}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════
// 학생 페이지
// ══════════════════════════════════════════════════════════
function StudentPage({quizId, ownerUid}) {
  const [quiz,setQuiz]=useState(null); const [ready,setReady]=useState(false);
  const [sid,setSid]=useState(""); const [confirmed,setConfirmed]=useState("");
  const [answers,setAnswers]=useState({}); const [result,setResult]=useState(null);
  const [loading,setLoading]=useState(false); const [done,setDone]=useState(false);

  useEffect(()=>{DB.findQuiz(quizId).then(q=>{setQuiz(q);setReady(true);});},[quizId]);
  useEffect(()=>{
    if(!confirmed||!quizId||!ownerUid)return;
    DB.getResults(ownerUid, quizId).then(rs=>{const ex=rs.find(r=>r.studentId===confirmed);if(ex?.submitted){setResult(ex.result);setDone(true);}});
  },[confirmed,quizId,ownerUid]);

  const submit=async()=>{
    if(!quiz)return;
    const missing=quiz.questions.filter((_,i)=>!answers[i]?.trim());
    if(missing.length)return alert(`${missing.length}개 문제에 답을 입력해주세요.`);
    setLoading(true);
    try{
      const prompt=`아래 퀴즈 문제와 학생 답변을 채점하세요.
${quiz.questions.map((q,i)=>`문제${i+1}[${q.type}]: ${q.question}\n${q.options?.length?q.options.join(" / "):""}\n정답: ${q.answer}\n학생답변: ${answers[i]||""}`).join("\n\n")}
아래 JSON 배열만 출력:
[{"correct":true또는false,"feedback":"채점이유와 해설"}]`;
      const raw=await gemini(prompt);
      const graded=parseJSON(raw)||quiz.questions.map(()=>({correct:false,feedback:"채점 오류"}));
      const score=graded.filter(g=>g.correct).length;
      const res={questions:quiz.questions,answers,graded,score};
      setResult(res);
      await DB.saveResult(ownerUid, quizId,{studentId:confirmed,score,result:res,submitted:true,submittedAt:new Date().toISOString()});
    }catch(e){alert("제출 오류: "+e.message);}
    setLoading(false);
  };

  if(!ready)return<Center><div style={{color:"#94A3B8"}}>로딩 중...</div></Center>;
  if(!quiz)return<Center><div style={{textAlign:"center",color:"#94A3B8"}}><div style={{fontSize:40}}>🔍</div><div style={{marginTop:10}}>퀴즈를 찾을 수 없습니다.</div></div></Center>;

  if(!confirmed)return(
    <Center>
      <div style={{background:"white",borderRadius:20,padding:32,width:310,boxShadow:"0 16px 48px rgba(0,0,0,0.15)",textAlign:"center"}}>
        <div style={{fontSize:40,marginBottom:10}}>🧩</div>
        <div style={{fontWeight:900,fontSize:18,color:PU,marginBottom:3}}>ASSESS AI - QUIZ</div>
        <div style={{fontWeight:700,fontSize:14,color:DK,marginBottom:3}}>{quiz.title}</div>
        <div style={{fontSize:12,color:"#64748B",marginBottom:20}}>📚 {quiz.subject} · {quiz.questions?.length||0}문제</div>
        <label style={{display:"block",textAlign:"left",fontSize:12,fontWeight:600,color:"#475569",marginBottom:6}}>학년-반-번호를 입력하세요</label>
        <input value={sid} onChange={e=>setSid(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sid.trim()&&setConfirmed(sid.trim())} placeholder="예: 3-2-15" autoFocus
          style={{...INP,fontSize:20,textAlign:"center",fontWeight:700,padding:"12px",borderRadius:10}}/>
        <button onClick={()=>sid.trim()&&setConfirmed(sid.trim())} style={B(PU,undefined,{width:"100%",marginTop:10,padding:"12px",fontSize:14,borderRadius:10})}>시작하기</button>
      </div>
    </Center>
  );

  if(result)return(
    <div style={{minHeight:"100vh",background:"#F5F3FF"}}>
      <div style={{background:PU,color:"white",padding:"12px 16px"}}>
        <div style={{fontWeight:900,fontSize:16}}>ASSESS AI - QUIZ</div>
        <div style={{fontSize:11,opacity:0.75}}>{quiz.title} · {confirmed}</div>
      </div>
      <div style={{maxWidth:600,margin:"0 auto",padding:"20px 16px"}}>
        <div style={{background:"white",borderRadius:16,padding:24,textAlign:"center",marginBottom:20,boxShadow:"0 2px 8px rgba(0,0,0,0.08)"}}>
          <div style={{fontSize:48,marginBottom:8}}>🎉</div>
          <div style={{fontSize:28,fontWeight:900,color:PU,marginBottom:4}}>{result.score}/{quiz.questions?.length||0}점</div>
          <div style={{fontSize:14,color:"#64748B"}}>{done?"이미 제출한 퀴즈입니다.":"제출 완료!"}</div>
        </div>
        {result.questions?.map((q,i)=>{
          const g=result.graded?.[i];
          return(
            <div key={i} style={{background:"white",borderRadius:12,padding:18,marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,0.06)",borderLeft:`4px solid ${g?.correct?"#10B981":"#EF4444"}`}}>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
                <span style={{fontSize:16}}>{g?.correct?"✅":"❌"}</span>
                <span style={{fontSize:12,background:q.type==="객관식"?"#EFF6FF":"#FFF7ED",color:q.type==="객관식"?"#1D4ED8":"#C2410C",fontWeight:700,padding:"2px 8px",borderRadius:10}}>{q.type}</span>
                <span style={{fontWeight:700,fontSize:13,color:DK}}>Q{i+1}</span>
              </div>
              <div style={{fontSize:13,color:DK,marginBottom:8,lineHeight:1.6}}>{q.question}</div>
              {q.options?.length>0&&<div style={{marginBottom:8}}>{q.options.map((o,j)=><div key={j} style={{fontSize:12,color:"#475569",padding:"2px 0"}}>{o}</div>)}</div>}
              <div style={{fontSize:12,color:"#475569",marginBottom:4}}>내 답변: <strong>{result.answers?.[i]||"(미입력)"}</strong></div>
              <div style={{fontSize:12,color:"#16A34A",marginBottom:4}}>정답: <strong>{q.answer}</strong></div>
              {g?.feedback&&<div style={{fontSize:12,color:PU,background:"#F3F0FF",borderRadius:8,padding:"8px 10px",marginTop:6,lineHeight:1.6}}>💡 {g.feedback}</div>}
            </div>
          );
        })}
      </div>
    </div>
  );

  return(
    <div style={{minHeight:"100vh",background:"#F5F3FF"}}>
      <div style={{background:PU,color:"white",padding:"12px 16px",position:"sticky",top:0,zIndex:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={{fontWeight:900,fontSize:15}}>ASSESS AI - QUIZ</div><div style={{fontSize:11,opacity:0.75}}>{quiz.title}</div></div>
          <div style={{fontSize:11,opacity:0.75}}>👤 {confirmed} · {quiz.questions?.length||0}문제</div>
        </div>
      </div>
      <div style={{maxWidth:600,margin:"0 auto",padding:16}}>
        {quiz.questions?.map((q,i)=>(
          <div key={i} style={{background:"white",borderRadius:12,padding:18,marginBottom:14,boxShadow:"0 1px 4px rgba(0,0,0,0.07)"}}>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:10}}>
              <span style={{background:q.type==="객관식"?"#EFF6FF":"#FFF7ED",color:q.type==="객관식"?"#1D4ED8":"#C2410C",fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:10}}>{q.type}</span>
              <span style={{fontWeight:700,fontSize:14,color:DK}}>Q{i+1}</span>
            </div>
            <div style={{fontSize:14,color:DK,marginBottom:12,lineHeight:1.7}}>{q.question}</div>
            {q.type==="객관식"
              ?<div>{q.options?.map((opt,j)=>(
                  <div key={j} onClick={()=>setAnswers(p=>({...p,[i]:opt}))} style={{padding:"10px 14px",borderRadius:9,marginBottom:7,cursor:"pointer",border:`2px solid ${answers[i]===opt?PU:"#E2E8F0"}`,background:answers[i]===opt?"#F3F0FF":"white",fontSize:13,color:answers[i]===opt?PU:DK,fontWeight:answers[i]===opt?700:400,transition:"all 0.12s"}}>{opt}</div>
                ))}</div>
              :<textarea value={answers[i]||""} onChange={e=>setAnswers(p=>({...p,[i]:e.target.value}))} placeholder="답을 입력하세요..."
                  style={{...INP,height:80,resize:"vertical",fontSize:13,borderRadius:9}}/>
            }
          </div>
        ))}
        <button onClick={submit} disabled={loading} style={B(loading?"#A78BFA":PU,undefined,{width:"100%",padding:"13px",fontSize:15,borderRadius:10,marginTop:4,cursor:loading?"not-allowed":"pointer"})}>
          {loading?"⏳ 채점 중...":"✅ 제출하기"}
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
