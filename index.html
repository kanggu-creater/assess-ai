<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>ASSESS AI</title>
  <meta name="theme-color" content="#1D4ED8"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="ASSESS AI"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Firebase SDK (Auth 포함) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:'Segoe UI',system-ui,sans-serif;}</style>
</head>
<body>
<div id="root"></div>
<script>
// Firebase 초기화 (라이브러리 로드 대기 + 안전 처리)
const firebaseConfig = {
  apiKey: "AIzaSyCEfanJFvovY499hYXKaxkJnI2WZqG6ydU",
  authDomain: "assess-ai-77355.firebaseapp.com",
  databaseURL: "https://assess-ai-77355-default-rtdb.firebaseio.com",
  projectId: "assess-ai-77355",
  storageBucket: "assess-ai-77355.firebasestorage.app",
  messagingSenderId: "36791489485",
  appId: "1:36791489485:web:937b4ed1dd67af92b4aa84"
};

function safeInitFirebase(){
  if(typeof firebase==="undefined"||!firebase.initializeApp)return false;
  try{firebase.initializeApp(firebaseConfig);return true;}
  catch(e){if(e.message&&e.message.includes("already exists"))return true;console.error("[Firebase] init error:",e);return false;}
}

// 즉시 시도, 실패 시 최대 6초간 재시도
if(!safeInitFirebase()){
  let retries=0;
  const iv=setInterval(()=>{
    if(safeInitFirebase()||retries>30){clearInterval(iv);}
    retries++;
  },200);
}
</script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const BL="#1D4ED8", DK="#1E293B";
const btn=(bg,col="white",ex={})=>({padding:"10px 20px",background:bg,color:col,border:"none",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:14,...ex});
const inp={padding:"10px 12px",border:"1px solid #E2E8F0",borderRadius:8,fontSize:14,width:"100%",boxSizing:"border-box",outline:"none",fontFamily:"inherit"};
const shortCode=id=>id?id.slice(-6).toUpperCase():"";

const FIREBASE_URL = "https://assess-ai-77355-default-rtdb.firebaseio.com";

const CFG={
  get apiKey(){return localStorage.getItem("aai_key")||"";},
  set apiKey(v){localStorage.setItem("aai_key",v);},
};

async function loadGeminiKey(){
  try{
    const r=await fetch(`${FIREBASE_URL}/config/geminiKey.json`);
    const d=await r.json();
    if(d&&typeof d==="string"){CFG.apiKey=d;return true;}
    return false;
  }catch{return false;}
}

// ── Firebase DB (교사별로 분리) ────────────────────────────
const DB={
  async getA(uid){
    try{
      const path = uid ? `assessments/${uid}` : `assessments`;
      const r=await fetch(`${FIREBASE_URL}/${path}.json`);
      const d=await r.json();
      if(!d)return[];
      return Object.values(d).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
    }catch{return[];}
  },
  async setA(uid, arr){
    const obj={};arr.forEach(a=>{obj[a.id]=a;});
    await fetch(`${FIREBASE_URL}/assessments/${uid}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(obj)});
  },
  // 학생이 접근할 때는 모든 교사의 평가에서 검색
  async findAssessment(asmId){
    try{
      const r=await fetch(`${FIREBASE_URL}/assessments.json`);
      const d=await r.json();
      if(!d)return null;
      for(const uid of Object.keys(d)){
        if(d[uid][asmId])return {...d[uid][asmId], _ownerUid:uid};
      }
      return null;
    }catch{return null;}
  },
  async getR(uid, id){
    try{
      const r=await fetch(`${FIREBASE_URL}/results/${uid}/${id}.json`);
      const d=await r.json();
      if(!d)return[];
      return Object.values(d);
    }catch{return[];}
  },
  async setR(uid, id, arr){
    const obj={};
    arr.forEach(r=>{obj[r.studentId.replace(/[.#$/[\]\s]/g,"_")]=r;});
    await fetch(`${FIREBASE_URL}/results/${uid}/${id}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(obj)});
  },
  // ★ 학생 한 명의 데이터만 저장 (다른 학생 데이터에 영향 X) ★
  async setROne(uid, id, studentData){
    const key=studentData.studentId.replace(/[.#$/[\]\s]/g,"_");
    const res=await fetch(`${FIREBASE_URL}/results/${uid}/${id}/${key}.json`,{
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(studentData)
    });
    if(!res.ok)throw new Error(`저장 실패: ${res.status}`);
    return await res.json();
  },
};

async function askAI(msgs,sys){
  const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${CFG.apiKey}`,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({system_instruction:{parts:[{text:sys}]},contents:msgs,generationConfig:{maxOutputTokens:1000,temperature:0,thinkingConfig:{thinkingBudget:0}}}),
  });
  const d=await res.json();
  if(d.error)throw new Error(d.error.message);
  return d.candidates[0].content.parts.filter(p=>p.text).map(p=>p.text).join("");
}

function QRImage({url}){
  const ref=useRef(null);
  useEffect(()=>{
    if(!url||!ref.current)return;
    ref.current.innerHTML="";
    const gen=()=>new window.QRCode(ref.current,{text:url,width:256,height:256,correctLevel:window.QRCode.CorrectLevel.M});
    window.QRCode?gen():(()=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";s.onload=gen;document.head.appendChild(s);})();
  },[url]);
  return <div ref={ref} style={{lineHeight:0}}/>;
}

function Empty({icon,text}){return<div style={{textAlign:"center",padding:56,color:"#94A3B8"}}><div style={{fontSize:36,marginBottom:12}}>{icon}</div><div style={{fontSize:14}}>{text}</div></div>;}
function Center({children}){return<div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:"#F1F5F9"}}>{children}</div>;}

// ══════════════════════════════════════════════════════════
// ROOT
// ══════════════════════════════════════════════════════════
function App(){
  const [mode,setMode]=useState("loading");
  const [sAsmId,setSAsmId]=useState(null);
  const [sOwnerUid,setSOwnerUid]=useState(null);
  const [user,setUser]=useState(null);

  useEffect(()=>{
    const init=async()=>{
      await loadGeminiKey();

      const params=new URLSearchParams(window.location.search);
      const sid=params.get("id");
      const code=params.get("code");

      // 학생 모드 처리
      if(sid){
        const asm=await DB.findAssessment(sid);
        if(asm){setSAsmId(sid);setSOwnerUid(asm._ownerUid);setMode("student");return;}
      }
      if(code){
        // 코드로 검색 (모든 교사의 평가에서)
        try{
          const r=await fetch(`${FIREBASE_URL}/assessments.json`);
          const d=await r.json();
          if(d){
            for(const uid of Object.keys(d)){
              for(const aid of Object.keys(d[uid])){
                if(shortCode(aid)===code.toUpperCase()){
                  setSAsmId(aid);setSOwnerUid(uid);setMode("student");return;
                }
              }
            }
          }
        }catch{}
      }

      // 교사 모드 - Firebase 라이브러리 로딩 대기 (최대 8초)
      let waited=0;
      while((typeof firebase==="undefined"||!firebase.auth)&&waited<8000){
        await new Promise(r=>setTimeout(r,100));
        waited+=100;
      }
      if(typeof firebase!=="undefined"&&firebase.auth){
        // 정상: 로그인 상태 자동 감지
        firebase.auth().onAuthStateChanged(u=>{
          setUser(u);
          setMode(u?"teacher":"login");
        });
      }else{
        // Firebase 미로드: 일단 로그인 페이지 보여주고, 버튼 클릭 시 재시도
        setMode("login");
      }
    };
    init();
  },[]);

  if(mode==="loading")return<Center><div style={{color:"#94A3B8"}}>로딩 중...</div></Center>;
  if(mode==="student")return<StudentPage asmId={sAsmId} ownerUid={sOwnerUid}/>;
  if(mode==="login")return<LoginPage/>;
  return<TeacherApp user={user}/>;
}

// ══════════════════════════════════════════════════════════
// 로그인 페이지 (교사 로그인 + 학생 코드 입장)
// ══════════════════════════════════════════════════════════
function LoginPage(){
  const [view,setView]=useState("main"); // "main" or "student"
  const [code,setCode]=useState("");
  const [err,setErr]=useState("");
  const [checking,setChecking]=useState(false);

  const login=async()=>{
    // Firebase가 아직 로딩 안 됐으면 잠시 대기
    let waited=0;
    while((typeof firebase==="undefined"||!firebase.auth)&&waited<5000){
      await new Promise(r=>setTimeout(r,200));
      waited+=200;
    }
    if(typeof firebase==="undefined"||!firebase.auth){
      alert("로그인 시스템 연결에 실패했습니다.\n\n다음을 시도해보세요:\n• 페이지 새로고침 (F5)\n• 광고 차단 프로그램 끄기\n• 다른 네트워크(모바일 데이터) 시도");
      return;
    }
    const provider=new firebase.auth.GoogleAuthProvider();
    try{
      await firebase.auth().signInWithPopup(provider);
    }catch(e){
      alert("로그인 오류: "+e.message);
    }
  };

  const enterAsStudent=async()=>{
    const c=code.replace("#","").trim().toUpperCase();
    if(!c){setErr("입장 코드를 입력하세요.");return;}
    if(c.length!==6){setErr("입장 코드는 6자리입니다.");return;}
    setChecking(true);setErr("");
    // 코드 유효성 확인 후 이동 (유효하지 않으면 에러 표시)
    try{
      const r=await fetch(`${FIREBASE_URL}/assessments.json`);
      const d=await r.json();
      let found=false;
      if(d){
        for(const uid of Object.keys(d)){
          for(const aid of Object.keys(d[uid])){
            if(shortCode(aid)===c){found=true;break;}
          }
          if(found)break;
        }
      }
      if(!found){setErr("존재하지 않는 코드입니다. 다시 확인해주세요.");setChecking(false);return;}
      window.location.search=`?code=${c}`;
    }catch{
      setErr("연결 오류가 발생했습니다. 잠시 후 다시 시도해주세요.");
      setChecking(false);
    }
  };

  // 학생 코드 입력 화면
  if(view==="student"){
    return(
      <Center>
        <div style={{background:"white",borderRadius:20,padding:40,width:400,boxShadow:"0 16px 48px rgba(0,0,0,0.12)",textAlign:"center"}}>
          <div style={{fontSize:48,marginBottom:12}}>🎓</div>
          <h1 style={{fontSize:22,fontWeight:900,color:BL,marginBottom:8}}>학생 입장</h1>
          <p style={{color:"#64748B",fontSize:14,marginBottom:28,lineHeight:1.7}}>
            선생님이 알려주신 입장 코드를 입력하세요<br/>
            <span style={{fontSize:12,color:"#94A3B8"}}>(6자리 영문·숫자)</span>
          </p>
          <input
            value={code}
            onChange={e=>{setCode(e.target.value.toUpperCase());setErr("");}}
            onKeyDown={e=>e.key==="Enter"&&!checking&&enterAsStudent()}
            placeholder="A3F2B1"
            maxLength={6}
            autoFocus
            disabled={checking}
            style={{...inp,fontSize:28,textAlign:"center",fontWeight:900,letterSpacing:6,padding:"16px",borderRadius:10,borderColor:err?"#FCA5A5":"#E2E8F0"}}
          />
          {err&&<div style={{color:"#DC2626",fontSize:12,marginTop:8,fontWeight:600}}>{err}</div>}
          <button
            onClick={enterAsStudent}
            disabled={checking}
            style={btn(checking?"#94A3B8":BL,undefined,{width:"100%",padding:"14px",fontSize:15,marginTop:14,borderRadius:10,cursor:checking?"not-allowed":"pointer"})}
          >
            {checking?"확인 중...":"입장하기"}
          </button>
          <button
            onClick={()=>{setView("main");setCode("");setErr("");}}
            style={{width:"100%",padding:"11px",background:"none",border:"none",color:"#64748B",fontSize:13,cursor:"pointer",marginTop:4,fontWeight:600}}
          >
            ← 뒤로가기
          </button>
        </div>
      </Center>
    );
  }

  // 메인 로그인 화면
  return(
    <Center>
      <div style={{background:"white",borderRadius:20,padding:40,width:400,boxShadow:"0 16px 48px rgba(0,0,0,0.12)",textAlign:"center"}}>
        <div style={{fontSize:48,marginBottom:12}}>🔬</div>
        <h1 style={{fontSize:26,fontWeight:900,color:BL,marginBottom:8}}>ASSESS AI</h1>
        <p style={{color:"#64748B",fontSize:14,marginBottom:28,lineHeight:1.7}}>
          AI 기반 학생 질문 수행평가 시스템
        </p>
        <button onClick={login} style={{
          width:"100%",padding:"14px",background:"white",border:"1px solid #E2E8F0",
          borderRadius:10,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:12,
          fontSize:15,fontWeight:600,color:"#334155",boxShadow:"0 1px 3px rgba(0,0,0,0.06)",marginBottom:10
        }}>
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          교사 — Google 계정으로 로그인
        </button>
        <button onClick={()=>setView("student")} style={{
          width:"100%",padding:"14px",background:BL,border:"1px solid "+BL,
          borderRadius:10,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:10,
          fontSize:15,fontWeight:600,color:"white",boxShadow:"0 1px 3px rgba(29,78,216,0.2)"
        }}>
          <span style={{fontSize:18}}>🎓</span>
          학생 — 입장 코드로 입장하기
        </button>
        <p style={{fontSize:11,color:"#94A3B8",marginTop:18,lineHeight:1.7}}>
          교사는 로그인하여 본인 평가를 관리하고,<br/>
          학생은 입장 코드로 바로 참여할 수 있습니다.
        </p>
      </div>
    </Center>
  );
}

// ══════════════════════════════════════════════════════════
// 교사 앱
// ══════════════════════════════════════════════════════════
function TeacherApp({user}){
  const [tab,setTab]=useState("criteria");
  const [asms,setAsms]=useState([]);
  const [ready,setReady]=useState(false);
  const [menuOpen,setMenuOpen]=useState(false);

  useEffect(()=>{DB.getA(user.uid).then(a=>{setAsms(a);setReady(true);});},[user.uid]);

  const save=async next=>{await DB.setA(user.uid, next);setAsms(next);};
  const logout=async()=>{await firebase.auth().signOut();window.location.reload();};

  const TABS=[["criteria","📝 평가기준"],["qr","📱 QR코드"],["results","📊 결과확인"],["enter","🎓 학생입장"]];

  return(
    <div style={{minHeight:"100vh",background:"#F1F5F9"}}>
      <header style={{background:BL,color:"white",padding:"0 20px",display:"flex",alignItems:"center",justifyContent:"space-between",height:54}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:18,fontWeight:900}}>ASSESS AI</span>
          <span style={{height:16,width:1,background:"rgba(255,255,255,0.3)"}}/>
          <span style={{fontSize:12,opacity:0.7}}>교사용 관리 페이지</span>
        </div>
        <div style={{position:"relative"}}>
          <button onClick={()=>setMenuOpen(!menuOpen)} style={{display:"flex",alignItems:"center",gap:8,background:"rgba(255,255,255,0.15)",border:"none",borderRadius:20,padding:"4px 12px 4px 4px",cursor:"pointer",color:"white"}}>
            {user.photoURL ? <img src={user.photoURL} alt="" style={{width:28,height:28,borderRadius:"50%"}}/> : <div style={{width:28,height:28,borderRadius:"50%",background:"rgba(255,255,255,0.3)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>👤</div>}
            <span style={{fontSize:12,fontWeight:600}}>{user.displayName||"선생님"}</span>
          </button>
          {menuOpen && (
            <div style={{position:"absolute",top:"110%",right:0,background:"white",borderRadius:10,boxShadow:"0 8px 24px rgba(0,0,0,0.15)",minWidth:200,zIndex:100,overflow:"hidden"}}>
              <div style={{padding:"12px 14px",borderBottom:"1px solid #E2E8F0"}}>
                <div style={{fontSize:13,fontWeight:700,color:DK}}>{user.displayName}</div>
                <div style={{fontSize:11,color:"#64748B",marginTop:2}}>{user.email}</div>
              </div>
              <button onClick={logout} style={{width:"100%",padding:"11px 14px",border:"none",background:"none",cursor:"pointer",textAlign:"left",fontSize:13,color:"#DC2626",fontWeight:600}}>
                🚪 로그아웃
              </button>
            </div>
          )}
        </div>
      </header>

      <div style={{background:"white",borderBottom:"1px solid #E2E8F0",display:"flex",paddingLeft:12}}>
        {TABS.map(([id,label])=>(<button key={id} onClick={()=>setTab(id)} style={{padding:"12px 16px",border:"none",background:"none",cursor:"pointer",fontWeight:tab===id?700:500,fontSize:13,color:tab===id?BL:"#64748B",borderBottom:tab===id?`2px solid ${BL}`:"2px solid transparent"}}>{label}</button>))}
      </div>

      <main style={{maxWidth:960,margin:"0 auto",padding:"24px 20px"}}>
        {!ready?<Empty icon="⏳" text="로딩 중..."/>:<>
          {tab==="criteria"&&<CriteriaTab asms={asms} onSave={save}/>}
          {tab==="qr"&&<QRTab asms={asms}/>}
          {tab==="results"&&<ResultsTab asms={asms} uid={user.uid}/>}
          {tab==="enter"&&<StudentEnterTab asms={asms}/>}
        </>}
      </main>
    </div>
  );
}

function CriteriaTab({asms,onSave}){
  const empty={title:"",subject:"",grade:"",cls:"",criteria:"",maxScore:10};
  const [form,setForm]=useState(empty);
  const [editId,setEditId]=useState(null);
  const [flash,setFlash]=useState(false);
  const f=k=>e=>setForm(p=>({...p,[k]:e.target.value}));
  const submit=async()=>{
    if(!form.title.trim()||!form.criteria.trim())return alert("제목과 평가기준을 입력해주세요.");
    const next=editId?asms.map(a=>a.id===editId?{...a,...form}:a):[{...form,id:Date.now().toString(),createdAt:new Date().toISOString()},...asms];
    await onSave(next);setForm(empty);setEditId(null);setFlash(true);setTimeout(()=>setFlash(false),2000);
  };
  const del=async id=>{if(!confirm("삭제하시겠습니까?"))return;await onSave(asms.filter(a=>a.id!==id));};
  const edit=a=>{setForm({title:a.title,subject:a.subject,grade:a.grade,cls:a.cls,criteria:a.criteria,maxScore:a.maxScore});setEditId(a.id);window.scrollTo({top:0,behavior:"smooth"});};
  const copy=a=>{setForm({title:a.title,subject:a.subject,grade:a.grade,cls:"",criteria:a.criteria,maxScore:a.maxScore});setEditId(null);window.scrollTo({top:0,behavior:"smooth"});};
  return(
    <div>
      <div style={{background:"white",borderRadius:14,padding:24,boxShadow:"0 1px 4px rgba(0,0,0,0.07)",marginBottom:20}}>

function ResultsTab({asms, uid}){
  const [selId,setSelId]=useState("");
  const [results,setResults]=useState([]);
  const [exp,setExp]=useState({});
  useEffect(()=>{if(!selId)return;const load=()=>DB.getR(uid, selId).then(setResults);load();const iv=setInterval(load,4000);return()=>clearInterval(iv);},[selId, uid]);
  const sorted=[...results].sort((a,b)=>b.studentId.localeCompare(a.studentId));
  const asm=asms.find(a=>a.id===selId);
  const toggle=k=>setExp(p=>({...p,[k]:!p[k]}));
  const download=()=>{
    if(!asm)return;
    const rows=[];
    sorted.forEach(r=>{
      const uM=r.messages?.filter(m=>m.role==="user")||[];
      const aM=r.messages?.filter(m=>m.role==="assistant")||[];
      // 최고 점수를 받은 질문/답변 찾기
      let bestIdx=-1, bestScore=-1;
      aM.forEach((m,i)=>{
        const s=m.score??-1;
        if(s>bestScore){bestScore=s;bestIdx=i;}
      });
      if(bestIdx>=0){
        rows.push({
          "학번":r.studentId,
          "최고점수":bestScore,
          "최고점수 질문":uM[bestIdx]?.content||"",
          "AI답변":aM[bestIdx]?.answer||"",
          "AI피드백":aM[bestIdx]?.feedback||"",
          "총 시도횟수":uM.length,
          "제출여부":r.submitted?"제출":"미제출"
        });
      }else{
        rows.push({"학번":r.studentId,"최고점수":"미참여","최고점수 질문":"","AI답변":"","AI피드백":"","총 시도횟수":0,"제출여부":"미참여"});

    });
    const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();

  };
  return(
    <div>
      <div style={{display:"flex",gap:10,marginBottom:18,alignItems:"center",flexWrap:"wrap"}}>
        <select value={selId} onChange={e=>setSelId(e.target.value)} style={{flex:1,minWidth:200,padding:"10px 12px",border:"1px solid #E2E8F0",borderRadius:8,fontSize:13,outline:"none"}}>
          <option value="">📋 평가를 선택하세요</option>
          {asms.map(a=><option key={a.id} value={a.id}>{a.title}</option>)}
        </select>
        {selId&&<div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:11,color:"#94A3B8"}}>● 4초마다 자동갱신</span>
          <button onClick={download} style={btn("#059669",undefined,{fontSize:13,padding:"9px 16px",whiteSpace:"nowrap"})}>⬇ 엑셀 다운로드</button>
        </div>}
      </div>
      {selId&&sorted.length===0&&<Empty icon="⏳" text="아직 참여한 학생이 없습니다."/>}
      {sorted.length>0&&(
        <div style={{background:"white",borderRadius:14,overflow:"auto",boxShadow:"0 1px 4px rgba(0,0,0,0.07)"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr style={{background:"#F8FAFC"}}>
              {["학번","최종점수","최종질문","학생질문 / AI답변"].map(h=>(<th key={h} style={{padding:"11px 13px",textAlign:h==="최종점수"?"center":"left",fontWeight:600,color:"#475569",borderBottom:"1px solid #E2E8F0",whiteSpace:"nowrap"}}>{h}</th>))}
            </tr></thead>
            <tbody>
              {sorted.map((r,ri)=>{
                const uM=r.messages?.filter(m=>m.role==="user")||[];
                const aM=r.messages?.filter(m=>m.role==="assistant")||[];
                const rowExp=exp[r.studentId];
                return(<tr key={r.studentId} style={{borderBottom:"1px solid #E2E8F0",background:ri%2===0?"white":"#FAFBFC"}}>
                  <td style={{padding:"12px 13px",fontWeight:700,color:DK,whiteSpace:"nowrap"}}>{r.studentId}</td>
                  <td style={{padding:"12px 13px",textAlign:"center"}}>{r.submitted?<span style={{background:"#DCFCE7",color:"#166534",padding:"3px 10px",borderRadius:20,fontWeight:700}}>{r.finalScore}점</span>:<span style={{color:"#94A3B8",fontSize:12}}>진행중</span>}</td>
                  <td style={{padding:"12px 13px",maxWidth:160,fontSize:12,color:"#334155",lineHeight:1.5}}>{r.finalQuestion||<span style={{color:"#CBD5E1"}}>미제출</span>}</td>
                  <td style={{padding:"12px 13px",minWidth:300}}>
                    <div style={{display:"flex",flexDirection:"column",gap:8}}>
                      {(rowExp?uM:uM.slice(0,1)).map((m,i)=>{const ans=aM[i];const ak=`${r.studentId}_${i}`;const aExp=exp[ak];return(<div key={i} style={{background:"#F8FAFC",borderRadius:8,padding:9}}>
                        <div style={{fontWeight:600,color:DK,fontSize:12,marginBottom:5}}>Q. {m.content}</div>
                        {ans&&<><div style={{fontSize:11,color:"#475569",lineHeight:1.5,...(aExp?{}:{overflow:"hidden",display:"-webkit-box",WebkitLineClamp:1,WebkitBoxOrient:"vertical"})}}><span style={{color:BL,fontWeight:600}}>A. </span>{ans.answer}</div>
                        <div style={{display:"flex",alignItems:"center",gap:6,marginTop:4}}>
                          <button onClick={()=>toggle(ak)} style={{fontSize:10,color:BL,background:"none",border:"none",cursor:"pointer",padding:0,fontWeight:600}}>{aExp?"▲ 접기":"▼ 전체보기"}</button>
                          {ans.score!==undefined&&<span style={{fontSize:11,background:"#EFF6FF",color:BL,padding:"1px 7px",borderRadius:10,fontWeight:700}}>{ans.score}점</span>}
                        </div></>}
                      </div>);})}
                      {uM.length>1&&<button onClick={()=>toggle(r.studentId)} style={{alignSelf:"flex-start",fontSize:11,color:"#64748B",background:"#F1F5F9",border:"none",borderRadius:5,padding:"3px 8px",cursor:"pointer",fontWeight:600}}>{rowExp?"▲ 접기":`▼ 전체 보기 (${uM.length}개)`}</button>}
                    </div>
                  </td>
                </tr>);
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function StudentPage({asmId, ownerUid}){
  const [asm,setAsm]=useState(null);const [ready,setReady]=useState(false);
  const [sid,setSid]=useState("");const [confirmed,setConfirmed]=useState("");
  const [msgs,setMsgs]=useState([]);const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);const [best,setBest]=useState(0);
  const [submitted,setSubmitted]=useState(false);const [finalQ,setFinalQ]=useState("");
  const chatRef=useRef(null);

  useEffect(()=>{DB.findAssessment(asmId).then(a=>{setAsm(a);setReady(true);});},[asmId]);
  useEffect(()=>{if(chatRef.current)chatRef.current.scrollTop=chatRef.current.scrollHeight;},[msgs,loading]);
  useEffect(()=>{
    if(!confirmed||!asmId||!ownerUid)return;
    DB.getR(ownerUid, asmId).then(results=>{
      const ex=results.find(r=>r.studentId===confirmed);
      if(ex){setMsgs(ex.messages||[]);setBest(ex.bestScore||0);setSubmitted(ex.submitted||false);setFinalQ(ex.finalQuestion||"");}
    });
  },[confirmed,asmId,ownerUid]);

  const [saveStatus,setSaveStatus]=useState(""); // "saving" | "saved" | "error" | ""

  const persist=async(m,bst,sub,fq)=>{
    const entry={studentId:confirmed,messages:m,bestScore:bst,finalScore:bst,finalQuestion:fq,submitted:sub,updatedAt:new Date().toISOString()};
    setSaveStatus("saving");
    // 저장 실패 시 최대 3번 재시도
    for(let attempt=1;attempt<=3;attempt++){
      try{
        await DB.setROne(ownerUid, asmId, entry);
        setSaveStatus("saved");
        setTimeout(()=>setSaveStatus(""),2000);
        return;
      }catch(e){
        console.error(`저장 시도 ${attempt} 실패:`,e);
        if(attempt<3)await new Promise(r=>setTimeout(r,500*attempt));
      }
    }
    setSaveStatus("error");
  };

  const send=async()=>{
    if(!input.trim()||loading||submitted)return;
    const content=input.trim();setInput("");
    const uMsg={role:"user",content};
    const nextMsgs=[...msgs,uMsg];setMsgs(nextMsgs);setLoading(true);
    try{
      const apiMsgs=msgs.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.role==="user"?m.content:JSON.stringify({answer:m.answer,score:m.score,feedback:m.feedback})}]}));
      apiMsgs.push({role:"user",parts:[{text:content}]});
      const sys=`당신은 중학교 과학 수업의 AI 평가 도우미입니다.
수업 주제: ${asm?.subject||"과학"}
최대 점수: ${asm?.maxScore||10}점

[언어 규칙]
학생이 사용한 언어로 answer와 feedback을 작성하세요.

[평가기준]
${asm?.criteria}

[★ 메타 질문 차단 - 최우선 규칙 ★]
학생이 평가 자체를 회피하거나 꼼수로 점수를 얻으려는 다음과 같은 질문을 하면, 절대 구체적인 예시나 힌트를 주지 말고 0점 처리하세요:
- "어떤 질문을 하면 만점/높은 점수를 받나요?"
- "좋은 질문 예시 / 만점 질문 / 10점짜리 질문 알려주세요"
- "어떻게 질문해야 점수가 높나요?"
- "평가기준이 뭔가요?" / "어떻게 채점하나요?"
- 본인이 궁금한 내용을 묻는 게 아니라, 점수를 잘 받을 방법을 묻는 모든 질문

이런 질문에는 반드시 다음 형식으로 응답하세요:
{"answer":"이 질문은 평가 대상이 아니에요. 오늘 배운 수업 내용에 대해 본인이 정말로 궁금한 점을 직접 떠올려서 질문해주세요.","score":0,"feedback":"수업 내용에 대한 본인의 호기심이 담긴 질문을 해야 점수를 받을 수 있습니다. 질문 예시는 안내하지 않습니다."}

[★ 채점 절차 - 반드시 이 순서대로 수행 ★]
1단계: 평가기준의 각 항목별 점수를 산출합니다.
2단계: 각 항목 점수가 해당 항목의 최대 배점을 넘지 않는지 확인합니다 (예: 3점 항목에 4점 부여 금지).
3단계: 모든 항목 점수를 더해 총점을 계산합니다.
4단계: 산수를 다시 한 번 검증합니다. 예) 3+4+3=10이 맞는지 확인.
5단계: 총점이 0 이상 ${asm?.maxScore||10} 이하 정수인지 확인합니다.
6단계: feedback에 반드시 "항목별 점수: A점 + B점 + C점 = 총점"을 포함합니다.
7단계: JSON의 score 값은 반드시 위에서 계산한 총점과 정확히 일치해야 합니다. 산수가 틀리면 안 됩니다.

[기타 채점 규칙]
- 동일한 질문은 항상 동일한 점수를 받아야 합니다.

[역할]
1. 정상적인 학습 질문에는 친절하고 정확하게 답변하세요. 중학생 수준에 맞게 설명하세요.
2. 평가기준 항목별 점수와 합계를 feedback에 반드시 명시하세요.
3. 구체적인 질문 예시는 절대 주지 마세요. "원리나 이유를 탐구하는 방향이 좋다" 정도만 안내합니다.
4. 과도한 칭찬은 하지 마세요.

[응답 형식 - 반드시 JSON만 출력, 다른 텍스트 금지]
{"answer":"...","score":숫자,"feedback":"항목별 점수: ...점 + ...점 + ...점 = ...점. 추가 설명..."}`;
      const raw=await askAI(apiMsgs,sys);
      let parsed;try{const m=raw.replace(/```json|```/g,"").trim().match(/\{[\s\S]*\}/);parsed=m?JSON.parse(m[0]):{answer:raw,score:0,feedback:""};}catch{parsed={answer:raw,score:0,feedback:""};}
      // 점수 검증: 정수 + 0~max 범위로 강제 보정
      const maxS=asm?.maxScore||10;
      let s=parseInt(parsed.score);
      if(isNaN(s)||s<0)s=0;
      if(s>maxS)s=maxS;
      parsed.score=s;
      const aiMsg={role:"assistant",answer:parsed.answer,score:parsed.score,feedback:parsed.feedback};
      const finalMsgs=[...nextMsgs,aiMsg];const newBest=Math.max(best,parsed.score??0);
      setMsgs(finalMsgs);setBest(newBest);
      await persist(finalMsgs,newBest,submitted,finalQ);
    }catch(e){setMsgs([...nextMsgs,{role:"assistant",answer:`오류: ${e.message}`,score:0,feedback:""}]);}
    setLoading(false);
  };

  const submitFinal=async()=>{
    const lastU=[...msgs].reverse().find(m=>m.role==="user");
    if(!lastU)return alert("먼저 질문을 입력해주세요.");
    if(!confirm(`최종 제출하시겠습니까?\n점수: ${best}점\n질문: "${lastU.content}"`))return;
    setSubmitted(true);setFinalQ(lastU.content);
    await persist(msgs,best,true,lastU.content);
  };

  if(!ready)return<Center><div style={{color:"#94A3B8"}}>로딩 중...</div></Center>;
  if(!asm)return<Center><div style={{textAlign:"center",color:"#94A3B8"}}><div style={{fontSize:40}}>🔍</div><div style={{marginTop:10}}>평가를 찾을 수 없습니다.</div></div></Center>;

  if(!confirmed)return(
    <Center>
      <div style={{background:"white",borderRadius:20,padding:32,width:310,boxShadow:"0 16px 48px rgba(0,0,0,0.15)",textAlign:"center"}}>
        <div style={{fontSize:40,marginBottom:10}}>🔬</div>
        <div style={{fontWeight:900,fontSize:20,color:BL,marginBottom:3}}>ASSESS AI</div>
        <div style={{fontWeight:700,fontSize:14,color:DK,marginBottom:3}}>{asm.title}</div>
        {asm.subject&&<div style={{fontSize:12,color:"#64748B",marginBottom:20}}>📚 {asm.subject}</div>}
        <label style={{display:"block",textAlign:"left",fontSize:12,fontWeight:600,color:"#475569",marginBottom:6}}>학년-반-번호를 입력하세요</label>
        <input value={sid} onChange={e=>setSid(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sid.trim()&&setConfirmed(sid.replace(/\s+/g,""))} placeholder="예: 3-2-15" autoFocus
          style={{...inp,fontSize:18,textAlign:"center",fontWeight:700,padding:"12px",borderRadius:10}}/>
        <button onClick={()=>sid.trim()&&setConfirmed(sid.replace(/\s+/g,""))} style={btn(BL,undefined,{width:"100%",marginTop:10,padding:"12px",fontSize:14,borderRadius:10})}>확인하기</button>
      </div>
    </Center>
  );

  const uMsgs=msgs.filter(m=>m.role==="user");
  return(
    <div style={{display:"flex",flexDirection:"column",height:"100vh",background:"#F1F5F9"}}>
      <div style={{background:BL,color:"white",padding:"10px 14px",flexShrink:0}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={{fontWeight:900,fontSize:15}}>ASSESS AI</div><div style={{fontSize:11,opacity:0.75}}>{asm.title}</div></div>
          <div style={{textAlign:"right"}}><div style={{fontSize:11,opacity:0.75}}>👤 {confirmed}</div><div style={{fontWeight:800,fontSize:14}}>최고점수: {best}/{asm.maxScore}점</div></div>
        </div>
        {saveStatus==="saving"&&<div style={{marginTop:8,background:"rgba(255,255,255,0.2)",borderRadius:7,padding:"6px 12px",fontSize:11,fontWeight:600}}>💾 저장 중...</div>}
        {saveStatus==="saved"&&<div style={{marginTop:8,background:"#10B981",borderRadius:7,padding:"6px 12px",fontSize:11,fontWeight:600}}>✓ 서버에 저장됨</div>}
        {saveStatus==="error"&&<div style={{marginTop:8,background:"#DC2626",borderRadius:7,padding:"6px 12px",fontSize:11,fontWeight:700}}>⚠️ 저장 실패! 다시 질문해주세요</div>}
        {submitted&&<div style={{marginTop:8,background:"#10B981",borderRadius:7,padding:"7px 12px",fontSize:12,fontWeight:700}}>✅ 최종 제출 완료 · 점수: {best}점</div>}
      </div>
      <div ref={chatRef} style={{flex:1,overflowY:"auto",padding:14,display:"flex",flexDirection:"column",gap:12}}>
        <div style={{background:"#EFF6FF",borderRadius:10,padding:12,fontSize:13,color:"#1E40AF",lineHeight:1.7}}>
          <strong>👋 안녕하세요!</strong> 오늘 수업 내용과 관련된 질문을 해보세요.{asm.subject&&<><br/><span style={{color:"#3B82F6"}}>📚 {asm.subject}</span></>}
        </div>
        {msgs.map((m,i)=>(<div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start"}}>
          {m.role==="user"
            ?<div style={{background:BL,color:"white",borderRadius:"16px 16px 4px 16px",padding:"10px 13px",maxWidth:"72%",fontSize:13,lineHeight:1.5}}>{m.content}</div>
            :<div style={{maxWidth:"85%"}}>
              <div style={{background:"white",borderRadius:"4px 16px 16px 16px",padding:12,boxShadow:"0 1px 4px rgba(0,0,0,0.08)",fontSize:13,color:DK,lineHeight:1.7}}>{m.answer}</div>
              {m.score!==undefined&&<div style={{marginTop:6,background:"#F0FDF4",borderRadius:8,padding:"9px 12px",border:"1px solid #BBF7D0"}}>
                <div style={{fontWeight:800,color:"#166534",fontSize:13}}>📊 점수: {m.score}/{asm.maxScore}점</div>
                {m.feedback&&<div style={{color:"#15803D",fontSize:12,marginTop:4,lineHeight:1.5}}>💡 {m.feedback}</div>}
              </div>}
            </div>}
        </div>))}
        {loading&&<div style={{display:"flex",justifyContent:"flex-start"}}><div style={{background:"white",borderRadius:"4px 16px 16px 16px",padding:"11px 14px",boxShadow:"0 1px 4px rgba(0,0,0,0.08)",color:"#94A3B8",fontSize:13}}>⏳ AI가 답변 중...</div></div>}
      </div>
      <div style={{padding:"10px 14px",background:"white",borderTop:"1px solid #E2E8F0",flexShrink:0}}>
        {!submitted?(
          <>
            <div style={{display:"flex",gap:8,marginBottom:uMsgs.length>0?8:0}}>
              <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&send()} placeholder="수업과 관련된 질문을 입력하세요..." disabled={loading}
                style={{...inp,flex:1,borderRadius:9,padding:"11px 13px"}}/>
              <button onClick={send} disabled={loading||!input.trim()} style={btn(loading||!input.trim()?"#CBD5E1":BL,undefined,{cursor:loading?"not-allowed":"pointer",padding:"11px 16px"})}>전송</button>
            </div>
            {uMsgs.length>0&&<button onClick={submitFinal} style={btn("#059669",undefined,{width:"100%",padding:"10px",fontSize:13,borderRadius:9})}>✅ 최종 결과 제출 (최고 점수: {best}점)</button>}
          </>
        ):(
          <div style={{background:"#DCFCE7",borderRadius:9,padding:"11px",textAlign:"center",color:"#166534"}}>
            <div style={{fontWeight:800,fontSize:14,marginBottom:3}}>✅ 제출 완료! 최종 점수: {best}점</div>
            <div style={{fontSize:12,opacity:0.8}}>최종 질문: "{finalQ}"</div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
