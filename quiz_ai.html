<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>ASSESS AI - QUIZ</title>
  <meta name="theme-color" content="#7C3AED"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="ASSESS AI QUIZ"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:'Segoe UI',system-ui,sans-serif;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const FIREBASE_URL = "";
const GEMINI_KEY   = "";

const PU = "#7C3AED", DK = "#1E293B";
const btn = (bg, col="white", ex={}) => ({ padding:"10px 20px", background:bg, color:col, border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:14, ...ex });
const inp = { padding:"10px 12px", border:"1px solid #E2E8F0", borderRadius:8, fontSize:14, width:"100%", boxSizing:"border-box", outline:"none", fontFamily:"inherit" };
const shortCode = id => id ? id.slice(-6).toUpperCase() : "";

// ── 설정 ─────────────────────────────────────────────────
const CFG = {
  get fbUrl()  { return FIREBASE_URL || localStorage.getItem("quiz_fb")  || ""; },
  set fbUrl(v) { localStorage.setItem("quiz_fb",  v); },
  get apiKey() { return GEMINI_KEY   || localStorage.getItem("quiz_key") || ""; },
  set apiKey(v){ localStorage.setItem("quiz_key", v); },
  get ready()  { return !!(this.fbUrl && this.apiKey); },
};

const DB = {
  async getQ()  { try { const r=await fetch(`${CFG.fbUrl}/quizzes.json`); const d=await r.json(); if(!d) return []; return Object.values(d).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)); } catch { return []; } },
  async setQ(arr) { const obj={}; arr.forEach(q=>{obj[q.id]=q;}); await fetch(`${CFG.fbUrl}/quizzes.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(obj)}); },
  async getR(id) { try { const r=await fetch(`${CFG.fbUrl}/qresults/${id}.json`); const d=await r.json(); if(!d) return []; return Object.values(d); } catch { return []; } },
  async setR(id, arr) { const obj={}; arr.forEach(r=>{obj[r.studentId.replace(/[.#$/[\]\s]/g,"_")]=r;}); await fetch(`${CFG.fbUrl}/qresults/${id}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(obj)}); },
};

async function callAI(prompt) {
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${CFG.apiKey}`, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ contents:[{role:"user",parts:[{text:prompt}]}], generationConfig:{maxOutputTokens:2000,temperature:0,thinkingConfig:{thinkingBudget:0}} }),
  });
  const d = await res.json();
  if(d.error) throw new Error(d.error.message);
  return d.candidates[0].content.parts.filter(p=>p.text).map(p=>p.text).join("");
}

function QRImage({url}) {
  const ref = useRef(null);
  useEffect(()=>{
    if(!url||!ref.current) return;
    ref.current.innerHTML="";
    const gen=()=>new window.QRCode(ref.current,{text:url,width:240,height:240,correctLevel:window.QRCode.CorrectLevel.M});
    window.QRCode?gen():(()=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";s.onload=gen;document.head.appendChild(s);})();
  },[url]);
  return <div ref={ref} style={{lineHeight:0}}/>;
}

function Empty({icon,text}) { return <div style={{textAlign:"center",padding:48,color:"#94A3B8"}}><div style={{fontSize:36,marginBottom:10}}>{icon}</div><div style={{fontSize:14}}>{text}</div></div>; }
function Center({children}) { return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:"#F5F3FF"}}>{children}</div>; }

export default function App() {
  const [mode, setMode] = useState("loading");
  const [quizId, setQuizId] = useState(null);
  const [configured, setConfigured] = useState(CFG.ready);

  useEffect(()=>{
    const parse = async () => {
      const params = new URLSearchParams(window.location.search);
      const sid = params.get("id"), code = params.get("code");
      const h = window.location.hash;
      if(sid) { setQuizId(sid); setMode("student"); return; }
      if(code) { const qs=await DB.getQ(); const found=qs.find(q=>shortCode(q.id)===code.toUpperCase()); if(found){setQuizId(found.id);setMode("student");return;} }
      if(h.startsWith("#s/")) { setQuizId(decodeURIComponent(h.slice(3))); setMode("student"); return; }
      setMode("teacher");
    };
    parse();
  },[]);

  if(mode==="loading") return null;
  if(mode==="student") return <StudentPage quizId={quizId}/>;
  if(!configured) return <SetupPage onDone={()=>setConfigured(true)}/>;
  return <TeacherApp onSetup={()=>setConfigured(false)}/>;
}

// ── 초기 설정 페이지 ──────────────────────────────────────
function SetupPage({onDone}) {
  const [fb,  setFb]  = useState(CFG.fbUrl);
  const [key, setKey] = useState(CFG.apiKey);
  const save = () => {
    if(!fb.trim()||!key.trim()) return alert("두 항목 모두 입력해주세요.");
    CFG.fbUrl  = fb.trim().replace(/\/$/,"");
    CFG.apiKey = key.trim();
    onDone();
  };
  return (
    <Center>
      <div style={{background:"white",borderRadius:20,padding:40,width:500,boxShadow:"0 16px 48px rgba(0,0,0,0.12)"}}>
        <div style={{textAlign:"center",marginBottom:28}}>
          <div style={{fontSize:40,marginBottom:10}}>⚙️</div>
          <h1 style={{fontSize:22,fontWeight:900,color:PU}}>ASSESS AI - QUIZ</h1>
          <p style={{color:"#64748B",fontSize:13,marginTop:6}}>초기 설정을 완료하면 바로 사용할 수 있습니다</p>
        </div>
        <div style={{marginBottom:20}}>
          <label style={{fontSize:13,fontWeight:700,color:DK,display:"block",marginBottom:6}}>1. Firebase Realtime Database URL</label>
          <input style={inp} value={fb} onChange={e=>setFb(e.target.value)} placeholder="https://프로젝트명-default-rtdb.firebaseio.com"/>
          <div style={{fontSize:12,color:"#64748B",marginTop:8,lineHeight:1.8,background:"#F8FAFC",borderRadius:8,padding:12}}>
            ASSESS AI와 동일한 Firebase 주소를 사용하시면 됩니다.<br/>
            <strong>주소:</strong> https://assess-ai-77355-default-rtdb.firebaseio.com
          </div>
        </div>
        <div style={{marginBottom:28}}>
          <label style={{fontSize:13,fontWeight:700,color:DK,display:"block",marginBottom:6}}>2. Google Gemini API 키</label>
          <input style={inp} type="password" value={key} onChange={e=>setKey(e.target.value)} placeholder="AIza..."/>
          <div style={{fontSize:12,color:"#64748B",marginTop:8,lineHeight:1.8,background:"#F8FAFC",borderRadius:8,padding:12}}>
            <a href="https://aistudio.google.com/apikey" target="_blank" style={{color:PU}}>aistudio.google.com/apikey</a> → Create API Key (무료)
          </div>
        </div>
        <button onClick={save} style={btn(PU,undefined,{width:"100%",padding:"13px",fontSize:15,borderRadius:10})}>설정 완료 → 시작하기</button>
      </div>
    </Center>
  );
}

function TeacherApp({onSetup}) {
  const [tab, setTab] = useState("generate");
  const [quizzes, setQuizzes] = useState([]);
  const [ready, setReady] = useState(false);
  useEffect(()=>{ DB.getQ().then(q=>{setQuizzes(q);setReady(true);}); },[]);
  const save = async next => { await DB.setQ(next); setQuizzes(next); };
  const TABS = [["generate","✨ 문제 생성"],["list","📚 저장된 문제"],["qr","📱 QR코드"],["results","📊 결과 확인"]];
  return (
    <div style={{minHeight:"100vh",background:"#F5F3FF"}}>
      <header style={{background:PU,color:"white",padding:"0 20px",display:"flex",alignItems:"center",justifyContent:"space-between",height:54}}>
        <div style={{display:"flex",alignItems:"center"}}>
          <span style={{fontSize:18,fontWeight:900}}>ASSESS AI</span>
          <span style={{fontSize:18,fontWeight:400,marginLeft:6}}>- QUIZ</span>
          <span style={{height:16,width:1,background:"rgba(255,255,255,0.3)",margin:"0 12px"}}/>
          <span style={{fontSize:12,opacity:0.7}}>교사용 관리 페이지</span>
        </div>
        <button onClick={onSetup} style={{fontSize:11,background:"rgba(255,255,255,0.15)",border:"none",color:"white",borderRadius:6,padding:"4px 10px",cursor:"pointer"}}>⚙ 설정</button>
      </header>
      <div style={{background:"white",borderBottom:"1px solid #E2E8F0",display:"flex",paddingLeft:12}}>
        {TABS.map(([id,label])=>(<button key={id} onClick={()=>setTab(id)} style={{padding:"12px 16px",border:"none",background:"none",cursor:"pointer",fontWeight:tab===id?700:500,fontSize:13,color:tab===id?PU:"#64748B",borderBottom:tab===id?`2px solid ${PU}`:"2px solid transparent"}}>{label}</button>))}
      </div>
      <main style={{maxWidth:980,margin:"0 auto",padding:"24px 20px"}}>
        {!ready?<Empty icon="⏳" text="로딩 중..."/>:<>
          {tab==="generate" && <GenerateTab quizzes={quizzes} onSave={save} onSwitch={()=>setTab("list")}/>}
          {tab==="list"     && <ListTab quizzes={quizzes} onSave={save}/>}
          {tab==="qr"       && <QRTab quizzes={quizzes}/>}
          {tab==="results"  && <ResultsTab quizzes={quizzes}/>}
        </>}
      </main>
    </div>
  );
}

function GenerateTab({quizzes, onSave, onSwitch}) {
  const [title,setTitle]=useState(""); const [subject,setSubject]=useState("");
  const [grade,setGrade]=useState(""); const [cls,setCls]=useState("");
  const [context,setContext]=useState(""); const [loading,setLoading]=useState(false);
  const [questions,setQuestions]=useState([]); const [saved,setSaved]=useState(false);

  const generate = async () => {
    if(!title.trim()||!subject.trim()) return alert("제목과 수업 주제를 입력해주세요.");
    setLoading(true); setQuestions([]); setSaved(false);
    try {
      const prompt = `중학교 과학 수업의 형성평가 문제 5개를 출제해주세요.
수업 주제: ${subject}
${context?`수업 내용: ${context}`:""}
규칙: 객관식 3문제(보기 4개), 주관식 2문제, 중학생 수준
반드시 아래 JSON 배열만 출력하세요:
[
  {"type":"객관식","question":"문제","options":["①...","②...","③...","④..."],"answer":"①...","explanation":"해설"},
  {"type":"객관식","question":"문제","options":["①...","②...","③...","④..."],"answer":"②...","explanation":"해설"},
  {"type":"객관식","question":"문제","options":["①...","②...","③...","④..."],"answer":"③...","explanation":"해설"},
  {"type":"주관식","question":"문제","options":[],"answer":"정답","explanation":"해설"},
  {"type":"주관식","question":"문제","options":[],"answer":"정답","explanation":"해설"}
]`;
      const raw = await callAI(prompt);
      const match = raw.replace(/```json|```/g,"").trim().match(/\[[\s\S]*\]/);
      setQuestions(match ? JSON.parse(match[0]) : []);
    } catch(e) { alert("문제 생성 실패: "+e.message); }
    setLoading(false);
  };

  const updateQ=(i,f,v)=>{ const n=[...questions]; n[i]={...n[i],[f]:v}; setQuestions(n); };
  const updateOpt=(i,j,v)=>{ const n=[...questions]; n[i].options[j]=v; setQuestions(n); };

  const saveQuiz = async () => {
    if(!questions.length) return;
    const quiz={id:Date.now().toString(),title,subject,grade,cls,questions,createdAt:new Date().toISOString()};
    await onSave([quiz,...quizzes]); setSaved(true);
    setTimeout(()=>{ setSaved(false); onSwitch(); },1200);
  };

  return (
    <div>
      <div style={{background:"white",borderRadius:14,padding:24,boxShadow:"0 1px 4px rgba(0,0,0,0.07)",marginBottom:20}}>
        <h2 style={{margin:"0 0 18px",fontSize:16,fontWeight:700,color:DK}}>✨ AI 문제 자동 생성</h2>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
          <div><label style={{fontSize:13,fontWeight:600,color:"#475569",display:"block",marginBottom:5}}>퀴즈 제목 *</label><input style={inp} placeholder="예: 3학년 빛의 굴절 형성평가" value={title} onChange={e=>setTitle(e.target.value)}/></div>
          <div><label style={{fontSize:13,fontWeight:600,color:"#475569",display:"block",marginBottom:5}}>수업 주제 *</label><input style={inp} placeholder="예: 볼록렌즈와 오목렌즈" value={subject} onChange={e=>setSubject(e.target.value)}/></div>
          <div><label style={{fontSize:13,fontWeight:600,color:"#475569",display:"block",marginBottom:5}}>학년</label><input style={inp} placeholder="예: 3" value={grade} onChange={e=>setGrade(e.target.value)}/></div>
          <div><label style={{fontSize:13,fontWeight:600,color:"#475569",display:"block",marginBottom:5}}>반</label><input style={inp} placeholder="예: 2" value={cls} onChange={e=>setCls(e.target.value)}/></div>
        </div>
        <div style={{marginBottom:14}}>
          <label style={{fontSize:13,fontWeight:600,color:"#475569",display:"block",marginBottom:5}}>수업 내용 추가 설명 <span style={{fontWeight:400,color:"#94A3B8"}}>(선택)</span></label>
          <textarea style={{...inp,height:80,resize:"vertical"}} placeholder="오늘 배운 내용을 간단히 입력하면 더 좋은 문제가 나옵니다." value={context} onChange={e=>setContext(e.target.value)}/>
        </div>
        <button onClick={generate} disabled={loading} style={btn(loading?"#A78BFA":PU,undefined,{padding:"11px 24px",cursor:loading?"not-allowed":"pointer"})}>
          {loading?"⏳ 문제 생성 중...":"🤖 AI로 문제 생성"}
        </button>
      </div>

      {questions.length>0&&(
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <h3 style={{fontSize:15,fontWeight:700,color:DK}}>생성된 문제 ({questions.length}개)</h3>
            <button onClick={saveQuiz} style={btn(saved?"#10B981":PU,undefined,{fontSize:13,padding:"9px 20px"})}>{saved?"✓ 저장됨!":"💾 저장하기"}</button>
          </div>
          {questions.map((q,i)=>(
            <div key={i} style={{background:"white",borderRadius:12,padding:20,marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,0.07)"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                <span style={{background:q.type==="객관식"?"#EFF6FF":"#FFF7ED",color:q.type==="객관식"?"#1D4ED8":"#C2410C",fontSize:12,fontWeight:700,padding:"3px 10px",borderRadius:20}}>{q.type}</span>
                <span style={{fontWeight:700,fontSize:14,color:DK}}>Q{i+1}</span>
              </div>
              <div style={{marginBottom:10}}>
                <label style={{fontSize:12,fontWeight:600,color:"#475569",display:"block",marginBottom:4}}>문제</label>
                <textarea style={{...inp,height:70,resize:"vertical",fontSize:13}} value={q.question} onChange={e=>updateQ(i,"question",e.target.value)}/>
              </div>
              {q.type==="객관식"&&(
                <div style={{marginBottom:10}}>
                  <label style={{fontSize:12,fontWeight:600,color:"#475569",display:"block",marginBottom:6}}>보기</label>
                  {q.options.map((opt,j)=>(
                    <div key={j} style={{display:"flex",alignItems:"center",gap:6,marginBottom:5}}>
                      <span style={{fontSize:13,color:"#64748B",minWidth:16}}>{j+1}</span>
                      <input style={{...inp,fontSize:13}} value={opt} onChange={e=>updateOpt(i,j,e.target.value)}/>
                    </div>
                  ))}
                </div>
              )}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                <div><label style={{fontSize:12,fontWeight:600,color:"#16A34A",display:"block",marginBottom:4}}>정답</label><input style={{...inp,fontSize:13,borderColor:"#BBF7D0"}} value={q.answer} onChange={e=>updateQ(i,"answer",e.target.value)}/></div>
                <div><label style={{fontSize:12,fontWeight:600,color:"#7C3AED",display:"block",marginBottom:4}}>해설</label><input style={{...inp,fontSize:13,borderColor:"#DDD6FE"}} value={q.explanation} onChange={e=>updateQ(i,"explanation",e.target.value)}/></div>
              </div>
            </div>
          ))}
          <button onClick={saveQuiz} style={btn(saved?"#10B981":PU,undefined,{width:"100%",padding:"12px",fontSize:14,marginTop:4})}>{saved?"✓ 저장됨!":"💾 저장하기"}</button>
        </div>
      )}
    </div>
  );
}

function ListTab({quizzes, onSave}) {
  const [exp,setExp]=useState({});
  const toggle=id=>setExp(p=>({...p,[id]:!p[id]}));
  const del=async id=>{ if(!confirm("삭제하시겠습니까?"))return; await onSave(quizzes.filter(q=>q.id!==id)); };
  if(quizzes.length===0) return <Empty icon="📝" text="먼저 문제 생성 탭에서 퀴즈를 만들어주세요."/>;
  return (
    <div>
      {quizzes.map(q=>(
        <div key={q.id} style={{background:"white",borderRadius:12,marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,0.07)",overflow:"hidden"}}>
          <div style={{padding:"14px 18px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12}}>
            <div style={{flex:1,cursor:"pointer"}} onClick={()=>toggle(q.id)}>
              <div style={{fontWeight:700,fontSize:15,color:DK,marginBottom:3}}>{q.title}</div>
              <div style={{fontSize:12,color:"#64748B"}}>📚 {q.subject} {q.grade&&`· ${q.grade}학년`}{q.cls&&` ${q.cls}반`} · {q.questions?.length||0}문제 · {new Date(q.createdAt).toLocaleDateString()}</div>
            </div>
            <div style={{display:"flex",gap:6,flexShrink:0}}>
              <button onClick={()=>toggle(q.id)} style={btn("white",PU,{border:`1px solid ${PU}`,fontSize:12,padding:"6px 12px"})}>{exp[q.id]?"접기":"문제보기"}</button>
              <button onClick={()=>del(q.id)} style={btn("#FEF2F2","#DC2626",{border:"1px solid #FCA5A5",fontSize:12,padding:"6px 12px"})}>삭제</button>
            </div>
          </div>
          {exp[q.id]&&(
            <div style={{borderTop:"1px solid #F1F5F9",padding:"14px 18px",background:"#FAFAFA"}}>
              {q.questions?.map((qu,i)=>(
                <div key={i} style={{marginBottom:14,paddingBottom:14,borderBottom:i<q.questions.length-1?"1px solid #E2E8F0":"none"}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
                    <span style={{background:qu.type==="객관식"?"#EFF6FF":"#FFF7ED",color:qu.type==="객관식"?"#1D4ED8":"#C2410C",fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:10}}>{qu.type}</span>
                    <span style={{fontSize:13,fontWeight:600,color:DK}}>Q{i+1}. {qu.question}</span>
                  </div>
                  {qu.options?.length>0&&<div style={{marginLeft:16,marginBottom:6}}>{qu.options.map((o,j)=><div key={j} style={{fontSize:12,color:"#475569",marginBottom:2}}>{o}</div>)}</div>}
                  <div style={{fontSize:12,color:"#16A34A",marginLeft:16}}>✅ 정답: {qu.answer}</div>
                  <div style={{fontSize:12,color:"#7C3AED",marginLeft:16,marginTop:2}}>💡 {qu.explanation}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

function QRTab({quizzes}) {
  const [selId,setSelId]=useState(null);
  const sel=quizzes.find(q=>q.id===selId);
  const base=window.location.href.split(/[#?]/)[0];
  const stuUrl=selId?`${base}?id=${selId}`:"";
  return (
    <div>
      <p style={{color:"#64748B",fontSize:14,marginTop:0,marginBottom:16}}>퀴즈를 클릭하면 QR코드가 생성됩니다.</p>
      {quizzes.length===0?<Empty icon="📝" text="먼저 문제 생성 탭에서 퀴즈를 만들어주세요."/>:(
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(190px,1fr))",gap:10,marginBottom:24}}>
          {quizzes.map(q=>(
            <div key={q.id} onClick={()=>setSelId(q.id)} style={{background:"white",borderRadius:12,padding:16,cursor:"pointer",border:selId===q.id?`2px solid ${PU}`:"2px solid transparent",boxShadow:"0 1px 4px rgba(0,0,0,0.07)",transition:"all 0.15s"}}>
              <div style={{fontSize:26,marginBottom:8}}>📋</div>
              <div style={{fontWeight:700,fontSize:13,color:DK,marginBottom:3,lineHeight:1.4}}>{q.title}</div>
              <div style={{fontSize:11,color:"#94A3B8",marginBottom:6}}>{q.grade&&`${q.grade}학년 `}{q.cls&&`${q.cls}반`}</div>
              <div style={{fontSize:11,background:"#F3F0FF",color:PU,borderRadius:5,padding:"2px 7px",display:"inline-block",fontWeight:700,letterSpacing:1}}>#{shortCode(q.id)}</div>
            </div>
          ))}
        </div>
      )}
      {sel&&(
        <div style={{background:"white",borderRadius:14,padding:28,boxShadow:"0 1px 4px rgba(0,0,0,0.07)",display:"flex",flexDirection:"column",alignItems:"center"}}>
          <h3 style={{margin:"0 0 4px",fontSize:17,fontWeight:700,color:DK}}>{sel.title}</h3>
          <p style={{color:"#64748B",fontSize:13,margin:"0 0 4px"}}>📚 {sel.subject}</p>
          <p style={{color:"#94A3B8",fontSize:12,margin:"0 0 20px"}}>QR코드를 학생들에게 보여주세요</p>
          <div style={{padding:10,border:"1px solid #E2E8F0",borderRadius:10,background:"white"}}><QRImage url={stuUrl}/></div>
          <div style={{marginTop:16,background:"#F3F0FF",borderRadius:10,padding:"12px 24px",textAlign:"center"}}>
            <div style={{fontSize:11,color:"#64748B",marginBottom:3}}>QR이 안 될 경우 — 입장 코드</div>
            <div style={{fontSize:26,fontWeight:900,color:PU,letterSpacing:4}}>#{shortCode(sel.id)}</div>
          </div>
        </div>
      )}
    </div>
  );
}

function ResultsTab({quizzes}) {
  const [selId,setSelId]=useState(""); const [results,setResults]=useState([]);
  useEffect(()=>{ if(!selId)return; const load=()=>DB.getR(selId).then(setResults); load(); const iv=setInterval(load,4000); return()=>clearInterval(iv); },[selId]);
  const quiz=quizzes.find(q=>q.id===selId);
  const sorted=[...results].sort((a,b)=>b.studentId.localeCompare(a.studentId));
  const download=()=>{
    if(!quiz)return;
    const rows=sorted.map(r=>({ "학번":r.studentId, "점수":r.submitted?r.score:"미제출", "총점":quiz.questions?.length||5, "제출여부":r.submitted?"제출":"미제출", "제출시간":r.submittedAt||"" }));
    const ws=XLSX.utils.json_to_sheet(rows); const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"퀴즈결과");
    XLSX.writeFile(wb,`${quiz.title}_${quiz.grade||""}학년_${quiz.cls||""}반.xlsx`);
  };
  return (
    <div>
      <div style={{display:"flex",gap:10,marginBottom:18,alignItems:"center",flexWrap:"wrap"}}>
        <select value={selId} onChange={e=>setSelId(e.target.value)} style={{flex:1,minWidth:200,padding:"10px 12px",border:"1px solid #E2E8F0",borderRadius:8,fontSize:13,outline:"none"}}>
          <option value="">📋 퀴즈를 선택하세요</option>
          {quizzes.map(q=><option key={q.id} value={q.id}>{q.title}</option>)}
        </select>
        {selId&&<div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:11,color:"#94A3B8"}}>● 4초마다 자동갱신</span>
          <button onClick={download} style={btn("#059669",undefined,{fontSize:13,padding:"9px 16px",whiteSpace:"nowrap"})}>⬇ 엑셀 다운로드</button>
        </div>}
      </div>
      {selId&&sorted.length===0&&<Empty icon="⏳" text="아직 제출한 학생이 없습니다."/>}
      {sorted.length>0&&(
        <div style={{background:"white",borderRadius:14,overflow:"auto",boxShadow:"0 1px 4px rgba(0,0,0,0.07)"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr style={{background:"#F8FAFC"}}>
              {["학번","점수","제출여부","제출시간"].map(h=>(<th key={h} style={{padding:"11px 14px",textAlign:"left",fontWeight:600,color:"#475569",borderBottom:"1px solid #E2E8F0",whiteSpace:"nowrap"}}>{h}</th>))}
            </tr></thead>
            <tbody>
              {sorted.map((r,i)=>(
                <tr key={r.studentId} style={{borderBottom:"1px solid #E2E8F0",background:i%2===0?"white":"#FAFBFC"}}>
                  <td style={{padding:"12px 14px",fontWeight:700,color:DK}}>{r.studentId}</td>
                  <td style={{padding:"12px 14px"}}>{r.submitted?<span style={{background:"#DCFCE7",color:"#166534",padding:"3px 10px",borderRadius:20,fontWeight:700}}>{r.score}/{quiz?.questions?.length||5}점</span>:<span style={{color:"#94A3B8",fontSize:12}}>진행중</span>}</td>
                  <td style={{padding:"12px 14px"}}>{r.submitted?<span style={{color:"#059669",fontWeight:600}}>✅ 제출</span>:<span style={{color:"#94A3B8"}}>미제출</span>}</td>
                  <td style={{padding:"12px 14px",fontSize:12,color:"#64748B"}}>{r.submittedAt?new Date(r.submittedAt).toLocaleTimeString():"-"}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function StudentPage({quizId}) {
  const [quiz,setQuiz]=useState(null); const [ready,setReady]=useState(false);
  const [sid,setSid]=useState(""); const [confirmed,setConfirmed]=useState("");
  const [answers,setAnswers]=useState({}); const [result,setResult]=useState(null);
  const [submitting,setSubmitting]=useState(false); const [alreadyDone,setAlreadyDone]=useState(false);

  useEffect(()=>{ DB.getQ().then(list=>{ setQuiz(list.find(q=>q.id===quizId)||null); setReady(true); }); },[quizId]);
  useEffect(()=>{
    if(!confirmed||!quizId)return;
    DB.getR(quizId).then(results=>{ const ex=results.find(r=>r.studentId===confirmed); if(ex?.submitted){setResult(ex.result);setAlreadyDone(true);} });
  },[confirmed,quizId]);

  const submit = async () => {
    if(!quiz)return;
    const unanswered=quiz.questions.filter((_,i)=>!answers[i]?.trim());
    if(unanswered.length>0) return alert(`${unanswered.length}개 문제에 답을 입력해주세요.`);
    setSubmitting(true);
    try {
      const prompt=`아래 퀴즈 문제와 학생 답변을 채점해주세요.
${quiz.questions.map((q,i)=>`문제${i+1}[${q.type}]: ${q.question}\n${q.options?.length?q.options.join(" / "):""}\n정답: ${q.answer}\n학생답변: ${answers[i]||""}`).join("\n\n")}
반드시 아래 JSON 배열만 출력하세요:
[{"correct":true/false,"feedback":"채점이유와 간단한 해설"}]`;
      const raw=await callAI(prompt);
      const match=raw.replace(/```json|```/g,"").trim().match(/\[[\s\S]*\]/);
      const graded=match?JSON.parse(match[0]):quiz.questions.map(()=>({correct:false,feedback:"채점 오류"}));
      const score=graded.filter(g=>g.correct).length;
      const res={questions:quiz.questions,answers,graded,score};
      setResult(res);
      const results=await DB.getR(quizId);
      const idx=results.findIndex(r=>r.studentId===confirmed);
      const entry={studentId:confirmed,score,result:res,submitted:true,submittedAt:new Date().toISOString()};
      if(idx>=0)results[idx]=entry;else results.push(entry);
      await DB.setR(quizId,results);
    } catch(e){alert("제출 오류: "+e.message);}
    setSubmitting(false);
  };

  if(!ready) return <Center><div style={{color:"#94A3B8"}}>로딩 중...</div></Center>;
  if(!quiz)  return <Center><div style={{textAlign:"center",color:"#94A3B8"}}><div style={{fontSize:40}}>🔍</div><div style={{marginTop:10}}>퀴즈를 찾을 수 없습니다.</div></div></Center>;

  if(!confirmed) return (
    <Center>
      <div style={{background:"white",borderRadius:20,padding:32,width:310,boxShadow:"0 16px 48px rgba(0,0,0,0.15)",textAlign:"center"}}>
        <div style={{fontSize:40,marginBottom:10}}>🧩</div>
        <div style={{fontWeight:900,fontSize:18,color:PU,marginBottom:3}}>ASSESS AI - QUIZ</div>
        <div style={{fontWeight:700,fontSize:14,color:DK,marginBottom:3}}>{quiz.title}</div>
        <div style={{fontSize:12,color:"#64748B",marginBottom:20}}>📚 {quiz.subject} · {quiz.questions?.length||0}문제</div>
        <label style={{display:"block",textAlign:"left",fontSize:12,fontWeight:600,color:"#475569",marginBottom:6}}>학년-반-번호를 입력하세요</label>
        <input value={sid} onChange={e=>setSid(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sid.trim()&&setConfirmed(sid.trim())} placeholder="예: 3-2-15" autoFocus
          style={{...inp,fontSize:20,textAlign:"center",fontWeight:700,padding:"12px",borderRadius:10}}/>
        <button onClick={()=>sid.trim()&&setConfirmed(sid.trim())} style={btn(PU,undefined,{width:"100%",marginTop:10,padding:"12px",fontSize:14,borderRadius:10})}>시작하기</button>
      </div>
    </Center>
  );

  if(result) return (
    <div style={{minHeight:"100vh",background:"#F5F3FF",fontFamily:"'Segoe UI',system-ui,sans-serif"}}>
      <div style={{background:PU,color:"white",padding:"12px 16px"}}>
        <div style={{fontWeight:900,fontSize:16}}>ASSESS AI - QUIZ</div>
        <div style={{fontSize:11,opacity:0.75}}>{quiz.title} · {confirmed}</div>
      </div>
      <div style={{maxWidth:600,margin:"0 auto",padding:"20px 16px"}}>
        <div style={{background:"white",borderRadius:16,padding:24,textAlign:"center",marginBottom:20,boxShadow:"0 2px 8px rgba(0,0,0,0.08)"}}>
          <div style={{fontSize:48,marginBottom:8}}>🎉</div>
          <div style={{fontSize:28,fontWeight:900,color:PU,marginBottom:4}}>{result.score}/{quiz.questions?.length||0}점</div>
          <div style={{fontSize:14,color:"#64748B"}}>{alreadyDone?"이미 제출한 퀴즈입니다.":"제출 완료!"}</div>
        </div>
        {result.questions?.map((q,i)=>{
          const g=result.graded?.[i];
          return (
            <div key={i} style={{background:"white",borderRadius:12,padding:18,marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,0.06)",borderLeft:`4px solid ${g?.correct?"#10B981":"#EF4444"}`}}>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
                <span style={{fontSize:16}}>{g?.correct?"✅":"❌"}</span>
                <span style={{fontSize:12,background:q.type==="객관식"?"#EFF6FF":"#FFF7ED",color:q.type==="객관식"?"#1D4ED8":"#C2410C",fontWeight:700,padding:"2px 8px",borderRadius:10}}>{q.type}</span>
                <span style={{fontWeight:700,fontSize:13,color:DK}}>Q{i+1}</span>
              </div>
              <div style={{fontSize:13,color:DK,marginBottom:8,lineHeight:1.6}}>{q.question}</div>
              {q.options?.length>0&&<div style={{marginBottom:8}}>{q.options.map((o,j)=><div key={j} style={{fontSize:12,color:"#475569",padding:"3px 0"}}>{o}</div>)}</div>}
              <div style={{fontSize:12,color:"#475569",marginBottom:4}}>내 답변: <strong>{result.answers?.[i]||"(미입력)"}</strong></div>
              <div style={{fontSize:12,color:"#16A34A",marginBottom:4}}>정답: <strong>{q.answer}</strong></div>
              {g?.feedback&&<div style={{fontSize:12,color:"#7C3AED",background:"#F3F0FF",borderRadius:8,padding:"8px 10px",marginTop:6,lineHeight:1.6}}>💡 {g.feedback}</div>}
            </div>
          );
        })}
      </div>
    </div>
  );

  return (
    <div style={{minHeight:"100vh",background:"#F5F3FF",fontFamily:"'Segoe UI',system-ui,sans-serif"}}>
      <div style={{background:PU,color:"white",padding:"12px 16px",position:"sticky",top:0,zIndex:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={{fontWeight:900,fontSize:15}}>ASSESS AI - QUIZ</div><div style={{fontSize:11,opacity:0.75}}>{quiz.title}</div></div>
          <div style={{fontSize:11,opacity:0.75}}>👤 {confirmed} · {quiz.questions?.length||0}문제</div>
        </div>
      </div>
      <div style={{maxWidth:600,margin:"0 auto",padding:"16px"}}>
        {quiz.questions?.map((q,i)=>(
          <div key={i} style={{background:"white",borderRadius:12,padding:18,marginBottom:14,boxShadow:"0 1px 4px rgba(0,0,0,0.07)"}}>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:10}}>
              <span style={{background:q.type==="객관식"?"#EFF6FF":"#FFF7ED",color:q.type==="객관식"?"#1D4ED8":"#C2410C",fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:10}}>{q.type}</span>
              <span style={{fontWeight:700,fontSize:14,color:DK}}>Q{i+1}</span>
            </div>
            <div style={{fontSize:14,color:DK,marginBottom:12,lineHeight:1.7}}>{q.question}</div>
            {q.type==="객관식"
              ?<div>{q.options?.map((opt,j)=>(
                  <div key={j} onClick={()=>setAnswers(p=>({...p,[i]:opt}))}
                    style={{padding:"10px 14px",borderRadius:9,border:`2px solid ${answers[i]===opt?PU:"#E2E8F0"}`,background:answers[i]===opt?"#F3F0FF":"white",marginBottom:7,cursor:"pointer",fontSize:13,color:answers[i]===opt?PU:DK,fontWeight:answers[i]===opt?700:400,transition:"all 0.12s"}}>
                    {opt}
                  </div>
                ))}</div>
              :<textarea value={answers[i]||""} onChange={e=>setAnswers(p=>({...p,[i]:e.target.value}))} placeholder="답을 입력하세요..."
                  style={{...inp,height:80,resize:"vertical",fontSize:13,borderRadius:9}}/>
            }
          </div>
        ))}
        <button onClick={submit} disabled={submitting} style={btn(submitting?"#A78BFA":PU,undefined,{width:"100%",padding:"13px",fontSize:15,borderRadius:10,marginTop:4,cursor:submitting?"not-allowed":"pointer"})}>
          {submitting?"⏳ 채점 중...":"✅ 제출하기"}
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
